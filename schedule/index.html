<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>きょうあした予定帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予定帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0D0F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-screen phone app. Week strip on top, timeline or 2x2 matrix in the middle, quick-add bar pinned at the bottom. */
  --bg:#F3F3F5;
  --surface:#FFFFFF;
  --ink:#0D0D0D;
  --muted:#8B8B94;
  --line:#E4E4E9;
  --chip:#EAEAEE;
  --q1:#F0505A; --q1-soft:#FDE7E8;
  --q2:#4A78E8; --q2-soft:#E5ECFC;
  --q3:#EE9B1A; --q3-soft:#FDF0DA;
  --q4:#8E8E99; --q4-soft:#EEEEF1;
  --sun:#E5484D; --sat:#3E6FE0;
  --shadow:0 1px 2px rgba(13,13,13,.06),0 4px 14px rgba(13,13,13,.06);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --hour:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0F; --surface:#1A1A1E; --ink:#F2F2F4; --muted:#8F8F99; --line:#2A2A30; --chip:#26262C;
    --q1:#FF6B73; --q1-soft:#3A1C1F; --q2:#6E95F5; --q2-soft:#1B2540;
    --q3:#F5B040; --q3-soft:#3A2C14; --q4:#A0A0AA; --q4-soft:#26262C;
    --sun:#FF6B6F; --sat:#6E95F5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0F; --surface:#1A1A1E; --ink:#F2F2F4; --muted:#8F8F99; --line:#2A2A30; --chip:#26262C;
  --q1:#FF6B73; --q1-soft:#3A1C1F; --q2:#6E95F5; --q2-soft:#1B2540;
  --q3:#F5B040; --q3-soft:#3A2C14; --q4:#A0A0AA; --q4-soft:#26262C;
  --sun:#FF6B6F; --sat:#6E95F5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--q2);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 4px}
.month{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.month small{font-size:15px;font-weight:700;color:var(--muted);margin-left:6px}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:4px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"] i{background:#34C17B}
.sync[data-s="saving"] i,.sync[data-s="connecting"] i{background:var(--q3)}
.sync[data-s="error"] i,.sync[data-s="waiting"] i{background:var(--q1)}
.jump{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.jump button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.jump button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* week strip */
.week{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;align-items:center;padding:6px 8px 2px}
.wk-nav{height:44px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.wk-nav svg{width:16px;height:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border-radius:14px}
.day .wd{font-size:11px;font-weight:700;color:var(--muted)}
.day.sun .wd{color:var(--sun)} .day.sat .wd{color:var(--sat)}
.day .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;transition:background .15s}
.day.today .num{color:var(--q1)}
.day.sel .num{background:var(--ink);color:var(--bg)}
.day .dots{display:flex;gap:3px;height:5px}
.day .dots b{width:5px;height:5px;border-radius:50%}

/* summary */
.summary{display:flex;align-items:center;gap:10px;padding:10px 20px 8px;position:relative}
.sum-main{flex:1;min-width:0}
.sum-date{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--q1-soft);color:var(--q1)}
.tag.tmr{background:var(--q2-soft);color:var(--q2)}
.tag.past{background:var(--chip);color:var(--muted)}
.prog{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;max-width:160px;height:5px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.icon-btn svg{width:18px;height:18px}
.menu{position:absolute;right:20px;top:54px;z-index:30;background:var(--surface);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:6px;min-width:230px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-weight:500}
.menu button:hover{background:var(--chip)}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;margin:2px 20px 10px;background:var(--chip);border-radius:12px;padding:3px}
.seg button{padding:8px 0;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* timeline */
.untimed{margin:0 16px 12px;background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.untimed h3{margin:2px 4px 6px;font-size:12px;color:var(--muted);font-weight:700}
.ut{display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:10px;cursor:pointer}
.ut + .ut{border-top:1px solid var(--line)}
.ut .qbar{width:4px;align-self:stretch;border-radius:4px}
.ut .t{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.tl{position:relative;margin:0 16px 24px 0;height:calc(var(--hour) * 24 + 12px);cursor:copy}
.hr{position:absolute;left:0;right:0;height:var(--hour);border-top:1px solid var(--line)}
.hr span{position:absolute;left:0;width:52px;text-align:right;top:-9px;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);padding-right:6px;font-variant-numeric:tabular-nums}
.hr:first-child{border-top-color:transparent}
.hr.half{border-top:1px dashed var(--line);opacity:.5}
.blk{position:absolute;border-radius:12px;padding:5px 30px 5px 10px;overflow:hidden;cursor:pointer;border-left:4px solid;min-height:26px;transition:transform .1s;display:flex;flex-direction:column;gap:1px}
.blk:active{transform:scale(.98)}
.blk .bt{font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.blk .bm{font-size:11px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.blk.compact{flex-direction:row;align-items:center;gap:8px;padding-top:2px;padding-bottom:2px}
.blk.compact .bt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .chk{position:absolute;right:6px;top:5px}
.blk.done .bt,.ut.done .t,.mi.done .mt{text-decoration:line-through;opacity:.5}
.blk.done{opacity:.7}
.now{position:absolute;left:52px;right:0;height:0;border-top:2px solid var(--q1);z-index:5;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--q1)}
.q1{background:var(--q1-soft);border-color:var(--q1);color:var(--ink)}
.q2{background:var(--q2-soft);border-color:var(--q2)}
.q3{background:var(--q3-soft);border-color:var(--q3)}
.q4{background:var(--q4-soft);border-color:var(--q4)}

/* check circle */
.chk{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;flex:none;color:var(--muted);background:transparent}
.chk svg{width:12px;height:12px;opacity:0}
.chk.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chk.on svg{opacity:1}
.chk::after{content:"";position:absolute;inset:-10px}
.chk{position:relative}

/* empty */
.empty{margin:0 16px 14px;padding:16px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.empty p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.empty strong{color:var(--ink)}
.ex{display:flex;flex-wrap:wrap;gap:8px}
.ex button{padding:7px 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700}

/* matrix */
.mx{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:10px;padding:0 16px 16px;min-height:100%}
.axis{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.quad{background:var(--surface);border-radius:20px;padding:12px 10px 10px;display:flex;flex-direction:column;min-height:190px;box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .12s,background .12s}
.quad.over{border-color:var(--qc)}
.qh{display:flex;align-items:flex-start;gap:8px;padding:0 4px 6px}
.qh .dot{width:10px;height:10px;border-radius:50%;background:var(--qc);margin-top:5px;flex:none}
.qh .qt{flex:1;min-width:0}
.qh h3{margin:0;font-size:13.5px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.qh p{margin:0;font-size:11px;color:var(--muted);font-weight:500}
.qadd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--chip);flex:none}
.qadd svg{width:14px;height:14px}
.ql{display:flex;flex-direction:column;gap:2px;flex:1}
.mi{display:flex;align-items:flex-start;gap:8px;padding:7px 6px;border-radius:10px;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.mi:hover{background:var(--chip)}
.mi .chk{width:20px;height:20px;margin-top:1px}
.mi .mt{flex:1;min-width:0;font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.mi .mtm{display:block;font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.mi.dragging{opacity:.3}
.qempty{font-size:12px;color:var(--muted);padding:6px;opacity:.8}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;background:var(--surface);box-shadow:0 12px 30px rgba(0,0,0,.25);border-radius:12px;opacity:.95}

/* composer */
.composer{background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
.cmp-extra{display:none;padding:2px 0 8px}
.composer.focus .cmp-extra{display:block}
.hint{font-size:11.5px;color:var(--muted);margin:0 2px 7px}
.qchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.qchip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--chip);font-size:12.5px;font-weight:700;color:var(--muted)}
.qchip i{width:8px;height:8px;border-radius:50%}
.qchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cmp-row{display:flex;gap:8px;align-items:center}
.cmp-row input{flex:1;min-width:0;height:46px;border-radius:999px;border:0;background:var(--chip);padding:0 18px;font-size:16px;outline:none}
.cmp-row input:focus{box-shadow:0 0 0 2px var(--ink) inset}
.send{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.more-btn{width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none}
.more-btn svg{width:20px;height:20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:50;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 20px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow-y:auto;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion: reduce){.sheet,.scrim,.blk,.bar span{transition:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-head h2{margin:0;font-size:15px;color:var(--muted);font-weight:700}
.sheet-head .icon-btn{box-shadow:none;background:var(--chip);width:32px;height:32px}
.f-title{width:100%;border:0;background:transparent;font-size:22px;font-weight:800;padding:6px 0 10px;outline:none;border-bottom:1px solid var(--line)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.field.col{flex-direction:column;align-items:stretch}
.lbl{font-size:13px;font-weight:700;color:var(--muted);flex:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{padding:7px 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=date],input[type=time]{border:0;background:var(--chip);border-radius:10px;padding:7px 10px;font-weight:700;font-variant-numeric:tabular-nums;min-height:36px}
.time-row{justify-content:flex-start;flex-wrap:wrap}
.time-row .sep{color:var(--muted)}
.time-row .row{flex-basis:100%;justify-content:flex-start}
.chip,.qchip{white-space:nowrap}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--ink)}
.switch:checked::after{transform:translateX(20px)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.qopt{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--chip);text-align:left;border:2px solid transparent}
.qopt i{width:10px;height:10px;border-radius:50%;flex:none}
.qopt b{display:block;font-size:13px}
.qopt small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.qopt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
textarea{width:100%;min-height:64px;border:0;border-radius:12px;background:var(--chip);padding:10px 12px;resize:vertical;margin-top:12px;outline:none}
.sheet-actions{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.sheet-actions .spacer{flex:1}
.danger{color:var(--q1);font-weight:700;padding:10px 6px}
.ghostbtn{display:inline-flex;align-items:center;gap:6px;padding:11px 14px;border-radius:999px;background:var(--chip);font-weight:700;font-size:13px;text-decoration:none;color:var(--ink)}
.ghostbtn svg{width:15px;height:15px}
.primary{padding:12px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:380px){
  .month{font-size:22px}
  .day .num{width:32px;height:32px;font-size:15px}
  .mx{gap:8px;padding:0 10px 12px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div>
        <h1 class="month" id="month">11月 <small>2026</small></h1>
        <div class="sync" id="sync" data-s="local"><i></i><span>この端末に保存</span></div>
      </div>
      <div class="jump" role="group" aria-label="すぐ移動">
        <button id="j-today" aria-pressed="true">今日</button>
        <button id="j-tmr" aria-pressed="false">明日</button>
      </div>
    </div>
    <nav class="week" id="week" aria-label="週"></nav>
    <div class="summary">
      <div class="sum-main">
        <div class="sum-date" id="sum-date"></div>
        <div class="prog"><div class="bar"><span id="bar"></span></div><span id="prog-t"></span></div>
      </div>
      <button class="icon-btn" id="menu-btn" aria-label="その他の操作" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <div class="menu" id="menu" role="menu">
        <button role="menuitem" id="m-carry">終わっていない予定を翌日へ移す</button>
        <button role="menuitem" id="m-copy">この日の予定をテキストでコピー</button>
      </div>
    </div>
    <div class="seg" role="tablist" aria-label="表示">
      <button role="tab" id="t-tl" aria-selected="true">タイムライン</button>
      <button role="tab" id="t-mx" aria-selected="false">マトリクス</button>
    </div>
  </header>

  <main id="main"></main>

  <div class="composer" id="composer">
    <div class="cmp-extra">
      <p class="hint">「19:00 ジム」「9-12 授業」「明日 7時 起床」と書くと時間つきで入ります</p>
      <div class="qchips" id="qchips" role="group" aria-label="優先度"></div>
    </div>
    <div class="cmp-row">
      <input id="quick" type="text" enterkeyhint="done" autocomplete="off" placeholder="例：19:00-20:00 ジム" aria-label="予定をすばやく追加">
      <button class="more-btn" id="open-sheet" aria-label="詳しく追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg>
      </button>
      <button class="send" id="send" aria-label="追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="sheet-h">予定を追加</h2>
    <button class="icon-btn" id="f-close" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <input id="f-title" class="f-title" placeholder="なにをする？" autocomplete="off" aria-label="タイトル">
  <div class="field">
    <span class="lbl">日付</span>
    <div class="row">
      <button class="chip" id="f-d0" type="button">今日</button>
      <button class="chip" id="f-d1" type="button">明日</button>
      <input type="date" id="f-date" aria-label="日付を選ぶ">
    </div>
  </div>
  <div class="field">
    <label class="lbl" for="f-timed">時間を決める</label>
    <input type="checkbox" class="switch" id="f-timed">
  </div>
  <div class="field time-row" id="time-row">
    <input type="time" id="f-start" aria-label="開始時刻" step="300">
    <span class="sep">〜</span>
    <input type="time" id="f-end" aria-label="終了時刻" step="300">
    <div class="row" id="dur">
      <button class="chip" type="button" data-m="30">30分</button>
      <button class="chip" type="button" data-m="60">1時間</button>
      <button class="chip" type="button" data-m="120">2時間</button>
    </div>
  </div>
  <div class="field col">
    <span class="lbl">優先度</span>
    <div class="qgrid" id="f-q"></div>
  </div>
  <textarea id="f-memo" placeholder="メモ（持ち物・場所など）" aria-label="メモ"></textarea>
  <div class="sheet-actions">
    <button class="danger" id="f-del" type="button">削除</button>
    <span class="spacer"></span>
    <a class="ghostbtn" id="f-gcal" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Googleカレンダーへ
    </a>
    <button class="primary" id="f-save" type="button">保存</button>
  </div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const Q = {
  1:{name:"今すぐやる", sub:"急ぎ・重要"},
  2:{name:"予定に入れる", sub:"重要・急がない"},
  3:{name:"さっと片づける", sub:"急ぎ・重要でない"},
  4:{name:"余裕があれば", sub:"急がない・重要でない"}
};
const WD = ["日","月","火","水","木","金","土"];
const LS_KEY = "kyouashita.v1";
const $ = id => document.getElementById(id);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const toMin = s => { if(!s) return null; const [h,m]=s.split(":").map(Number); return h*60+m; };
const fromMin = m => { m=Math.max(0,Math.min(1439,Math.round(m))); return pad(Math.floor(m/60))+":"+pad(m%60); };
const dayLabel = k => { const d=parseKey(k); return (d.getMonth()+1)+"月"+d.getDate()+"日("+WD[d.getDay()]+")"; };
const rel = k => { const t=todayKey(); if(k===t) return "今日"; if(k===addDays(t,1)) return "明日"; if(k===addDays(t,-1)) return "昨日"; return ""; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- state ---------- */
const state = { days:{}, sel:todayKey(), view:"timeline", composeQ:2, needScroll:true };
let meta = { syncedOnce:false };

function cleanItem(x){
  if(!x || typeof x!=="object") return null;
  const t = /^\d{2}:\d{2}$/;
  const it = {
    id: typeof x.id==="string" ? x.id.slice(0,40) : uid(),
    title: typeof x.title==="string" ? x.title.slice(0,200) : "",
    start: typeof x.start==="string" && t.test(x.start) ? x.start : null,
    end: typeof x.end==="string" && t.test(x.end) ? x.end : null,
    q: [1,2,3,4].includes(x.q) ? x.q : 2,
    done: !!x.done,
    memo: typeof x.memo==="string" ? x.memo.slice(0,2000) : "",
    c: typeof x.c==="number" ? x.c : 0
  };
  if(!it.start) it.end=null;
  return it.title ? it : null;
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const v = JSON.parse(raw);
    if(v && v.days){ for(const k in v.days){ if(/^\d{4}-\d{2}-\d{2}$/.test(k) && Array.isArray(v.days[k])) state.days[k]=v.days[k].map(cleanItem).filter(Boolean); } }
    if(v && v.meta) meta = Object.assign(meta, v.meta);
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({days:state.days, meta})); }catch(e){}
}
const items = k => state.days[k] || (state.days[k]=[]);
function sorted(list){
  return list.slice().sort((a,b)=>{
    if(a.start && b.start) return toMin(a.start)-toMin(b.start) || a.c-b.c;
    if(a.start) return -1; if(b.start) return 1;
    return a.c-b.c;
  });
}

/* ---------- sync (claude db, falls back to this device) ---------- */
let remote = null;
const pending = new Map();
function setSync(s){
  const L = {local:"この端末に保存", connecting:"同期を確認中…", synced:"同期済み・どの端末でも見られます", saving:"保存中…", waiting:"同期待ち（この端末の記録を表示中）", error:"同期できません（この端末には保存済み）"};
  const el=$("sync"); el.dataset.s=s; el.querySelector("span").textContent=L[s]||"";
}
function changed(k){
  saveLocal();
  if(!remote) return;
  let p = pending.get(k);
  if(!p){ p={ver:0,writing:false,again:false,timer:null}; pending.set(k,p); }
  p.ver++; clearTimeout(p.timer);
  p.timer = setTimeout(()=>flush(k), 500);
  setSync("saving");
}
async function writeDay(k){
  return remote.col.doc("d-"+k).set({ items: state.days[k]||[], updatedAt: Date.now() });
}
async function flush(k){
  const p = pending.get(k); if(!p) return;
  clearTimeout(p.timer);
  if(p.writing){ p.again=true; return; }
  p.writing=true; const ver=p.ver; let ok=true;
  try{ await writeDay(k); }
  catch(e){
    if(e && e.code==="unavailable"){
      await new Promise(r=>setTimeout(r, 700+Math.random()*900));
      try{ await writeDay(k); }catch(e2){ ok=false; }
    } else {
      ok=false;
      if(e && e.code==="quota_exceeded") toast("保存容量がいっぱいです。古い日の予定を消すと保存できます");
    }
  }
  p.writing=false;
  if(p.again || p.ver!==ver){ p.again=false; flush(k); return; }
  pending.delete(k);
  if(!ok){ setSync("error"); return; }
  if(pending.size===0){ meta.syncedOnce=true; saveLocal(); setSync("synced"); }
}
function flushAll(){ for(const k of pending.keys()) flush(k); }

async function initDb(){
  if(!window.claude || typeof window.claude.use!=="function"){ setSync("local"); return; }
  setSync("connecting");
  let db=null, user=null;
  try{ [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); }catch(e){}
  if(!db || !user){ setSync("local"); return; }
  let id=null; try{ id = await user.id(); }catch(e){}
  if(!id){ setSync("local"); return; }
  remote = { col: db.collection("data/users/"+id) };
  let confirmed=false;
  const timer = setTimeout(()=>{ if(!confirmed) setSync("waiting"); }, 10000);
  remote.col.onSnapshot(snap=>{
    const rd = {};
    snap.docs.forEach(d=>{
      if(!d.exists || d.id.indexOf("d-")!==0) return;
      const v = d.data()||{};
      rd[d.id.slice(2)] = Array.isArray(v.items) ? v.items.map(cleanItem).filter(Boolean) : [];
    });
    const definitive = !snap.metadata.fromCache;
    if(definitive && !confirmed && !meta.syncedOnce){
      for(const k in state.days){ if(!(k in rd) && state.days[k].length) changed(k); }
    }
    for(const k in rd){ if(!pending.has(k)) state.days[k]=rd[k]; }
    if(definitive){
      for(const k in state.days){ if(!(k in rd) && !pending.has(k) && meta.syncedOnce) state.days[k]=[]; }
      if(!confirmed){ confirmed=true; clearTimeout(timer); }
      if(pending.size===0){ meta.syncedOnce=true; setSync("synced"); }
    }
    saveLocal(); render();
  }, err=>{
    clearTimeout(timer);
    remote = null;
    setSync(err && err.code==="revoked" ? "local" : "error");
  });
}

/* ---------- quick-add parser ---------- */
function parseQuick(raw){
  let s = raw.replace(/[０-９：]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g," ").trim();
  let off = null;
  const dm = s.match(/^(今日|きょう|明後日|あさって|明日|あした|あす)\s*/);
  if(dm){ off = /今日|きょう/.test(dm[1]) ? 0 : /明後日|あさって/.test(dm[1]) ? 2 : 1; s = s.slice(dm[0].length); }
  const T = "(\\d{1,2})(?:[:](\\d{2})|時(?:(\\d{1,2})分|(半))?)";
  const To = T+"?";
  const SEP = "\\s*(?:-|~|〜|～|ー|－|−|から)\\s*";
  const tm = (h,a,b,half) => (+h)*60 + (a!=null ? +a : b!=null ? +b : half ? 30 : 0);
  const okT = (h,a,b) => +h<=24 && (a==null || +a<60) && (b==null || +b<60);
  let start=null, end=null, m;
  const tries = [
    [new RegExp("^"+To+SEP+To+"(?:まで)?\\s*"), true, "head"],
    [new RegExp("^"+T+"(?:から)?\\s*"), false, "head"],
    [new RegExp("\\s+"+To+SEP+To+"(?:まで)?$"), true, "tail"],
    [new RegExp("\\s+"+T+"(?:から)?$"), false, "tail"]
  ];
  for(const [re, range, where] of tries){
    m = s.match(re); if(!m) continue;
    if(where==="head" && s.charAt(m[0].length)==="間") continue;
    if(!okT(m[1],m[2],m[3]) || (range && !okT(m[5],m[6],m[7]))) continue;
    start = tm(m[1],m[2],m[3],m[4]);
    if(range) end = tm(m[5],m[6],m[7],m[8]);
    s = where==="head" ? s.slice(m[0].length) : s.slice(0, m.index);
    break;
  }
  if(start!=null && start>=1440) start=null;
  if(start!=null){
    if(end==null || end<=start) end = Math.min(start+60, 1439);
    end = Math.min(end, 1439);
  }
  const title = s.trim() || (start!=null ? "予定" : "");
  return { title, off, start: start!=null?fromMin(start):null, end: start!=null?fromMin(end):null };
}
window.__parseQuick = parseQuick;

/* ---------- rendering ---------- */
const main = $("main");
function render(){
  renderHeader(); renderWeek(); renderSummary();
  if(state.view==="timeline") renderTimeline(); else renderMatrix();
}
function renderHeader(){
  const d = parseKey(state.sel);
  $("month").innerHTML = (d.getMonth()+1)+"月 <small>"+d.getFullYear()+"</small>";
  const t = todayKey();
  $("j-today").setAttribute("aria-pressed", state.sel===t);
  $("j-tmr").setAttribute("aria-pressed", state.sel===addDays(t,1));
}
function renderWeek(){
  const d = parseKey(state.sel);
  const startK = addDays(state.sel, -d.getDay());
  const t = todayKey();
  let h = '<button class="wk-nav" data-w="-7" aria-label="前の週"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>';
  for(let i=0;i<7;i++){
    const k = addDays(startK,i), dd = parseKey(k), list = state.days[k]||[];
    const cls = ["day", i===0?"sun":"", i===6?"sat":"", k===t?"today":"", k===state.sel?"sel":""].join(" ");
    const qs = [...new Set(list.filter(x=>!x.done).map(x=>x.q))].sort().slice(0,3);
    h += '<button class="'+cls+'" data-k="'+k+'" aria-label="'+dayLabel(k)+(list.length?"、予定"+list.length+"件":"")+'"'+(k===state.sel?' aria-current="date"':'')+'><span class="wd">'+WD[i]+'</span><span class="num">'+dd.getDate()+'</span><span class="dots">'+qs.map(q=>'<b style="background:var(--q'+q+')"></b>').join("")+'</span></button>';
  }
  h += '<button class="wk-nav" data-w="7" aria-label="次の週"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>';
  $("week").innerHTML = h;
}
function renderSummary(){
  const r = rel(state.sel);
  const cls = r==="今日" ? "" : r==="明日" ? "tmr" : "past";
  $("sum-date").innerHTML = esc(dayLabel(state.sel)) + (r ? '<span class="tag '+cls+'">'+r+'</span>' : "");
  const list = items(state.sel), done = list.filter(x=>x.done).length;
  $("bar").style.width = list.length ? (done/list.length*100)+"%" : "0%";
  $("prog-t").textContent = list.length ? done+" / "+list.length+" 完了" : "予定なし";
}
function chk(it){ return '<button class="chk'+(it.done?" on":"")+'" data-chk="'+it.id+'" aria-label="'+(it.done?"未完了に戻す":"完了にする")+'" aria-pressed="'+it.done+'">'+CHECK+'</button>'; }

function layout(list){
  const ev = list.map(it=>{ const s=toMin(it.start); let e=toMin(it.end); if(e==null||e<=s) e=s+30; return {it,s,e,ve:Math.max(e,s+30)}; }).sort((a,b)=>a.s-b.s||b.e-a.e);
  const clusters=[]; let cur=[], end=-1;
  for(const x of ev){ if(cur.length && x.s>=end){ clusters.push(cur); cur=[]; end=-1; } cur.push(x); end=Math.max(end,x.ve); }
  if(cur.length) clusters.push(cur);
  for(const c of clusters){ const cols=[]; for(const x of c){ let i=cols.findIndex(e=>e<=x.s); if(i<0){ i=cols.length; cols.push(0);} cols[i]=x.ve; x.col=i; } c.forEach(x=>x.cols=cols.length); }
  return ev;
}
function renderTimeline(){
  const list = items(state.sel);
  const untimed = sorted(list.filter(x=>!x.start));
  const timed = list.filter(x=>x.start);
  let h = "";
  if(!list.length){
    h += '<div class="empty"><p><strong>'+esc(dayLabel(state.sel))+'の予定はまだありません。</strong><br>下の欄に書いてそのまま追加できます。タイムラインの空いている時間をタップしても追加できます。</p><div class="ex">'+
      ["7:00 起床","9-12 授業","18-22 バイト","23時 寝る"].map(x=>'<button data-ex="'+x+'">'+x+'</button>').join("")+'</div></div>';
  }
  if(untimed.length){
    h += '<div class="untimed"><h3>時間を決めていない予定</h3>'+untimed.map(it=>
      '<div class="ut'+(it.done?" done":"")+'" data-id="'+it.id+'" role="button" tabindex="0"><span class="qbar" style="background:var(--q'+it.q+')"></span><span class="t">'+esc(it.title)+'</span>'+chk(it)+'</div>').join("")+'</div>';
  }
  const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"))||64;
  h += '<div class="tl" id="tl" aria-label="タイムライン。空いている時間をタップすると追加">';
  for(let i=0;i<24;i++) h += '<div class="hr" style="top:'+(i*H+6)+'px"><span>'+pad(i)+':00</span></div>';
  for(const x of layout(timed)){
    const top = x.s/60*H+6, ht = Math.max((x.e-x.s)/60*H-3, 26);
    const compact = (x.e-x.s) < 45;
    const left = "calc(58px + (100% - 62px) * "+(x.col/x.cols)+")";
    const width = "calc((100% - 62px) / "+x.cols+" - 4px)";
    h += '<div class="blk q'+x.it.q+(x.it.done?" done":"")+(compact?" compact":"")+'" data-id="'+x.it.id+'" role="button" tabindex="0" style="top:'+top+'px;height:'+ht+'px;left:'+left+';width:'+width+'">'+
      '<span class="bt">'+esc(x.it.title)+'</span><span class="bm">'+x.it.start+(x.it.end?"–"+x.it.end:"")+'</span>'+chk(x.it)+'</div>';
  }
  if(state.sel===todayKey()) h += '<div class="now" id="now"></div>';
  h += '</div>';
  main.innerHTML = h;
  placeNow();
  if(state.needScroll){
    state.needScroll=false;
    let target;
    if(state.sel===todayKey()){ const n=new Date(); target=(n.getHours()*60+n.getMinutes()-60)/60*H; }
    else if(timed.length){ target=(Math.min(...timed.map(x=>toMin(x.start)))-30)/60*H; }
    else target = 7*H;
    const tl = $("tl");
    main.scrollTop = Math.max(0, tl.offsetTop + target);
  }
}
function placeNow(){
  const el=$("now"); if(!el) return;
  const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"))||64;
  const n=new Date(); el.style.top = ((n.getHours()*60+n.getMinutes())/60*H+6)+"px";
}
function renderMatrix(){
  const list = items(state.sel);
  let h = '<div class="mx"><div class="axis"><span>急ぎ</span><span>急がない</span></div>';
  for(const q of [1,2,3,4]){
    const qs = sorted(list.filter(x=>x.q===q)).sort((a,b)=>a.done-b.done);
    h += '<section class="quad" data-q="'+q+'" style="--qc:var(--q'+q+')"><div class="qh"><span class="dot"></span><div class="qt"><h3>'+Q[q].name+'</h3><p>'+Q[q].sub+'</p></div><button class="qadd" data-addq="'+q+'" aria-label="'+Q[q].name+'に追加">'+PLUS+'</button></div><div class="ql">'+
      (qs.length ? qs.map(it=>'<div class="mi'+(it.done?" done":"")+'" data-id="'+it.id+'" role="button" tabindex="0">'+chk(it)+'<span class="mt">'+(it.start?'<span class="mtm">'+it.start+(it.end?"–"+it.end:"")+'</span>':"")+esc(it.title)+'</span></div>').join("") : '<div class="qempty">ドラッグでここへ移動</div>')+
      '</div></section>';
  }
  main.innerHTML = h + '</div>';
}
function renderQChips(){
  $("qchips").innerHTML = [1,2,3,4].map(q=>'<button class="qchip" data-cq="'+q+'" aria-pressed="'+(state.composeQ===q)+'"><i style="background:var(--q'+q+')"></i>'+Q[q].name+'</button>').join("");
}

/* ---------- actions ---------- */
function find(id){ for(const k in state.days){ const it=state.days[k].find(x=>x.id===id); if(it) return {k,it}; } return null; }
function toggle(id){ const f=find(id); if(!f) return; f.it.done=!f.it.done; changed(f.k); render(); }
function selectDay(k){ if(k===state.sel) return; state.sel=k; state.needScroll=true; closeMenu(); render(); }
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

function quickAdd(){
  const inp=$("quick"); const v=inp.value.trim(); if(!v) return;
  const p = parseQuick(v); if(!p.title){ return; }
  const k = p.off!=null ? addDays(todayKey(), p.off) : state.sel;
  const it = {id:uid(), title:p.title, start:p.start, end:p.end, q:state.composeQ, done:false, memo:"", c:Date.now()};
  items(k).push(it); changed(k);
  inp.value="";
  if(k!==state.sel){ state.sel=k; }
  state.needScroll = false;
  render();
  toast(dayLabel(k)+(it.start?" "+it.start:"")+" に追加しました");
  if(state.view==="timeline" && it.start){
    const el = main.querySelector('[data-id="'+it.id+'"]');
    if(el) el.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }
}

/* ---------- sheet ---------- */
let edit = null; // {id|null, k, q, timed}
function gcalUrl(k, title, start, end, memo){
  const d = k.replace(/-/g,"");
  const dates = start ? d+"T"+start.replace(":","")+"00/"+d+"T"+(end||start).replace(":","")+"00" : d+"/"+addDays(k,1).replace(/-/g,"");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title||"予定")+"&dates="+dates+"&ctz=Asia%2FTokyo"+(memo?"&details="+encodeURIComponent(memo):"");
}
function updateSheetUI(){
  const t=todayKey();
  $("f-d0").setAttribute("aria-pressed", edit.k===t);
  $("f-d1").setAttribute("aria-pressed", edit.k===addDays(t,1));
  $("f-date").value = edit.k;
  $("f-timed").checked = edit.timed;
  $("time-row").style.display = edit.timed ? "" : "none";
  $("f-q").querySelectorAll(".qopt").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.q===edit.q));
  const s=$("f-start").value, e=$("f-end").value;
  const dur = toMin(e)-toMin(s);
  $("dur").querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed", edit.timed && dur===+b.dataset.m));
  $("f-gcal").href = gcalUrl(edit.k, $("f-title").value.trim(), edit.timed?s:null, edit.timed?e:null, $("f-memo").value.trim());
}
function openSheet(opts){
  closeMenu();
  const it = opts.id ? find(opts.id) : null;
  if(it){
    edit = {id:it.it.id, k:it.k, q:it.it.q, timed:!!it.it.start};
    $("sheet-h").textContent="予定を編集";
    $("f-title").value=it.it.title; $("f-memo").value=it.it.memo||"";
    $("f-start").value=it.it.start||"19:00"; $("f-end").value=it.it.end||fromMin(toMin(it.it.start||"19:00")+60);
    $("f-del").style.display="";
  } else {
    edit = {id:null, k:opts.k||state.sel, q:opts.q||state.composeQ, timed:opts.start!=null};
    $("sheet-h").textContent="予定を追加";
    $("f-title").value=opts.title||""; $("f-memo").value="";
    const s = opts.start!=null ? opts.start : 19*60;
    $("f-start").value=fromMin(s); $("f-end").value=fromMin(s+60);
    $("f-del").style.display="none";
  }
  resetDel();
  updateSheetUI();
  $("scrim").classList.add("open"); $("sheet").classList.add("open");
  if(!it) setTimeout(()=>$("f-title").focus(), 60);
}
function closeSheet(){ $("scrim").classList.remove("open"); $("sheet").classList.remove("open"); edit=null; }
function saveSheet(){
  const title=$("f-title").value.trim();
  if(!title){ $("f-title").focus(); toast("タイトルを入れてください"); return; }
  let start=null,end=null;
  if(edit.timed){
    start=$("f-start").value||null; end=$("f-end").value||null;
    if(start && (!end || toMin(end)<=toMin(start))) end=fromMin(toMin(start)+60);
    if(!start) end=null;
  }
  const memo=$("f-memo").value.trim();
  if(edit.id){
    const f=find(edit.id);
    if(f){
      Object.assign(f.it,{title,start,end,q:edit.q,memo});
      if(f.k!==edit.k){ state.days[f.k]=state.days[f.k].filter(x=>x.id!==f.it.id); changed(f.k); items(edit.k).push(f.it); }
      changed(edit.k);
    }
  } else {
    items(edit.k).push({id:uid(),title,start,end,q:edit.q,done:false,memo,c:Date.now()});
    changed(edit.k);
  }
  const k=edit.k; closeSheet();
  if(k!==state.sel){ state.sel=k; state.needScroll=true; }
  render();
}
let delArmed=false, delT;
function resetDel(){ delArmed=false; clearTimeout(delT); $("f-del").textContent="削除"; }
function delSheet(){
  if(!delArmed){ delArmed=true; $("f-del").textContent="もう一度押すと削除"; delT=setTimeout(resetDel,3000); return; }
  const f=find(edit.id); if(f){ state.days[f.k]=state.days[f.k].filter(x=>x.id!==edit.id); changed(f.k); }
  closeSheet(); render(); toast("削除しました");
}

/* ---------- menu ---------- */
function closeMenu(){ $("menu").classList.remove("open"); $("menu-btn").setAttribute("aria-expanded","false"); }
$("menu-btn").addEventListener("click", e=>{ e.stopPropagation(); const o=$("menu").classList.toggle("open"); $("menu-btn").setAttribute("aria-expanded", o); });
document.addEventListener("click", e=>{ if(!e.target.closest("#menu")) closeMenu(); });
$("m-carry").addEventListener("click", ()=>{
  const k=state.sel, next=addDays(k,1);
  const left = items(k).filter(x=>!x.done);
  if(!left.length){ toast("移す予定はありません"); closeMenu(); return; }
  state.days[k] = items(k).filter(x=>x.done);
  left.forEach(x=>items(next).push(x));
  changed(k); changed(next); closeMenu();
  toast(left.length+"件を"+dayLabel(next)+"へ移しました");
  render();
});
$("m-copy").addEventListener("click", async ()=>{
  const list = sorted(items(state.sel));
  const text = dayLabel(state.sel)+"の予定\n"+(list.length ? list.map(x=>(x.done?"✓ ":"・")+(x.start?x.start+(x.end?"-"+x.end:"")+" ":"")+x.title).join("\n") : "（なし）");
  closeMenu();
  try{ await navigator.clipboard.writeText(text); toast("コピーしました"); }
  catch(e){ toast("コピーできませんでした"); }
});

/* ---------- events ---------- */
$("j-today").addEventListener("click", ()=>{ state.needScroll=true; selectDay(todayKey()); });
$("j-tmr").addEventListener("click", ()=>selectDay(addDays(todayKey(),1)));
$("week").addEventListener("click", e=>{
  const d=e.target.closest("[data-k]"); if(d) return selectDay(d.dataset.k);
  const w=e.target.closest("[data-w]"); if(w) selectDay(addDays(state.sel, +w.dataset.w));
});
function setView(v){
  state.view=v; state.needScroll = v==="timeline";
  $("t-tl").setAttribute("aria-selected", v==="timeline"); $("t-mx").setAttribute("aria-selected", v==="matrix");
  main.scrollTop=0; render();
  try{ localStorage.setItem(LS_KEY+".view", v); }catch(e){}
}
$("t-tl").addEventListener("click", ()=>setView("timeline"));
$("t-mx").addEventListener("click", ()=>setView("matrix"));

let suppressClick=false;
main.addEventListener("click", e=>{
  if(suppressClick){ suppressClick=false; return; }
  const c=e.target.closest("[data-chk]"); if(c){ e.stopPropagation(); return toggle(c.dataset.chk); }
  const ex=e.target.closest("[data-ex]"); if(ex){ $("quick").value=ex.dataset.ex+" "; $("quick").focus(); return; }
  const aq=e.target.closest("[data-addq]"); if(aq) return openSheet({q:+aq.dataset.addq});
  const it=e.target.closest("[data-id]"); if(it) return openSheet({id:it.dataset.id});
  const tl=e.target.closest("#tl");
  if(tl){
    const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"))||64;
    const y = e.clientY - tl.getBoundingClientRect().top - 6;
    const m = Math.max(0, Math.min(23*60+30, Math.floor(y/H*2)*30));
    openSheet({start:m});
  }
});
main.addEventListener("keydown", e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.matches("[data-id]")){ e.preventDefault(); openSheet({id:e.target.dataset.id}); }
});

/* matrix drag between quadrants */
let drag=null;
main.addEventListener("pointerdown", e=>{
  if(state.view!=="matrix") return;
  const el=e.target.closest(".mi"); if(!el || e.target.closest(".chk")) return;
  const r=el.getBoundingClientRect();
  drag={id:el.dataset.id, el, x:e.clientX, y:e.clientY, ox:e.clientX-r.left, oy:e.clientY-r.top, w:r.width, started:false, touch:e.pointerType!=="mouse", lp:null, over:null};
  if(drag.touch){ const px=e.clientX, py=e.clientY; drag.lp=setTimeout(()=>{ if(drag && !drag.started) startDrag(px,py); }, 300); }
});
function startDrag(x,y){
  drag.started=true;
  const g=drag.el.cloneNode(true); g.classList.add("ghost"); g.style.width=drag.w+"px"; document.body.appendChild(g); drag.ghost=g;
  drag.el.classList.add("dragging");
  try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
  moveGhost(x,y);
}
function moveGhost(x,y){
  drag.ghost.style.transform="translate("+(x-drag.ox)+"px,"+(y-drag.oy)+"px) rotate(-1.5deg)";
  const under=document.elementFromPoint(x,y); const q=under && under.closest(".quad");
  if(drag.over && drag.over!==q) drag.over.classList.remove("over");
  if(q) q.classList.add("over"); drag.over=q;
}
window.addEventListener("pointermove", e=>{
  if(!drag) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 6){
      if(drag.touch){ clearTimeout(drag.lp); drag=null; return; }
      startDrag(e.clientX,e.clientY);
    } else return;
  }
  moveGhost(e.clientX,e.clientY);
});
function endDrag(drop){
  if(!drag) return;
  clearTimeout(drag.lp);
  if(drag.started){
    suppressClick=true; setTimeout(()=>suppressClick=false, 80);
    if(drag.over) drag.over.classList.remove("over");
    if(drag.ghost) drag.ghost.remove();
    drag.el.classList.remove("dragging");
    if(drop && drag.over){
      const q=+drag.over.dataset.q, f=find(drag.id);
      if(f && f.it.q!==q){ f.it.q=q; changed(f.k); render(); toast("「"+Q[q].name+"」へ移動しました"); }
    }
  }
  drag=null;
}
window.addEventListener("pointerup", ()=>endDrag(true));
window.addEventListener("pointercancel", ()=>endDrag(false));
document.addEventListener("touchmove", e=>{ if(drag && drag.started) e.preventDefault(); }, {passive:false});
main.addEventListener("contextmenu", e=>{ if(e.target.closest(".mi")) e.preventDefault(); });

/* composer */
const quick=$("quick");
quick.addEventListener("focus", ()=>$("composer").classList.add("focus"));
quick.addEventListener("blur", ()=>setTimeout(()=>{ if(!$("composer").contains(document.activeElement)) $("composer").classList.remove("focus"); }, 150));
quick.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.isComposing && e.keyCode!==229){ e.preventDefault(); quickAdd(); }
});
$("send").addEventListener("click", ()=>{ if(quick.value.trim()) quickAdd(); else quick.focus(); });
$("qchips").addEventListener("pointerdown", e=>e.preventDefault());
$("qchips").addEventListener("click", e=>{ const b=e.target.closest("[data-cq]"); if(!b) return; state.composeQ=+b.dataset.cq; renderQChips(); });
$("open-sheet").addEventListener("click", ()=>{
  const v=quick.value.trim();
  if(v){ const p=parseQuick(v); quick.value=""; openSheet({title:p.title, start:p.start!=null?toMin(p.start):null, k:p.off!=null?addDays(todayKey(),p.off):state.sel}); if(p.end) $("f-end").value=p.end; updateSheetUI(); }
  else openSheet({});
});

/* sheet controls */
$("f-q").innerHTML = [1,2,3,4].map(q=>'<button type="button" class="qopt" data-q="'+q+'"><i style="background:var(--q'+q+')"></i><span><b>'+Q[q].name+'</b><small>'+Q[q].sub+'</small></span></button>').join("");
$("f-q").addEventListener("click", e=>{ const b=e.target.closest(".qopt"); if(!b) return; edit.q=+b.dataset.q; updateSheetUI(); });
$("f-d0").addEventListener("click", ()=>{ edit.k=todayKey(); updateSheetUI(); });
$("f-d1").addEventListener("click", ()=>{ edit.k=addDays(todayKey(),1); updateSheetUI(); });
$("f-date").addEventListener("change", e=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){ edit.k=e.target.value; } updateSheetUI(); });
$("f-timed").addEventListener("change", e=>{ edit.timed=e.target.checked; updateSheetUI(); });
$("f-start").addEventListener("change", ()=>{
  const s=toMin($("f-start").value), en=toMin($("f-end").value);
  if(s!=null && (en==null || en<=s)) $("f-end").value=fromMin(s+60);
  updateSheetUI();
});
$("f-end").addEventListener("change", updateSheetUI);
$("dur").addEventListener("click", e=>{ const b=e.target.closest("[data-m]"); if(!b) return; const s=toMin($("f-start").value); if(s==null) return; $("f-end").value=fromMin(s + +b.dataset.m); updateSheetUI(); });
$("f-title").addEventListener("input", updateSheetUI);
$("f-memo").addEventListener("input", updateSheetUI);
$("f-title").addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.isComposing && e.keyCode!==229){ e.preventDefault(); saveSheet(); } });
$("f-save").addEventListener("click", saveSheet);
$("f-del").addEventListener("click", delSheet);
$("f-close").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if(edit) closeSheet(); closeMenu(); } });

/* housekeeping */
setInterval(()=>{ placeNow(); const t=todayKey(); if(t!==lastToday){ lastToday=t; render(); } }, 30000);
let lastToday=todayKey();
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushAll(); });
window.addEventListener("pagehide", flushAll);

/* boot */
loadLocal();
try{ const v=localStorage.getItem(LS_KEY+".view"); if(v==="matrix"){ state.view="matrix"; $("t-tl").setAttribute("aria-selected","false"); $("t-mx").setAttribute("aria-selected","true"); } }catch(e){}
renderQChips();
render();
initDb();
})();
</script>
</body>
</html>
