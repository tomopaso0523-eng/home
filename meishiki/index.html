言えず、依存関係に陥りやすい。`,work:`アート・デザイン・執筆・ファッションなどの創作、工芸やインテリア、教師・コーチ・メンター。`,advice:`「自分はどうしたいか」を常に意識し、自分を大切にしてくれる環境を選ぶことが最大の開運法。`},{read:`ひのえ`,image:`太陽`,keywords:[`陽気`,`情熱`,`カリスマ性`,`自由`,`開放的`,`指導力`],nature:`周囲を照らす太陽。決めたことには燃えるような情熱で即行動する。世間体や建前に囚われず、心を打たれた対象にまっすぐ熱中する唯我独尊タイプ。`,wants:`自分が「これだ」と思ったものに、周りを気にせず関心と情熱を注ぎたい。`,weak:`熱くなりすぎて冷静さを失う。言葉がストレートで敵を作りやすく、燃え尽きやすい。`,work:`エンタメ、演出、解説・評論、SNS発信、カウンセリングやコンサルなど人を元気づける仕事。主役になれる場所。`,advice:`地道に積み上げる忍耐をプラスする。少数でも理解者や親友を心から大事にする。`},{read:`ひのと`,image:`灯火・月`,keywords:[`二面性`,`ミステリアス`,`直観力`,`洞察力`,`優しさ`,`一途`],nature:`周りを温かく照らす灯火。柔らかい印象の内側に揺るがない強さを持ち、決めたら一途にやり切る。愛や絆がテーマのロマンチストで、根はとてもピュア。`,wants:`情熱を注げる対象。自分ならではの理想を形にしたい。`,weak:`影響を受けやすく、気を使いすぎて疲れる。溜め込んだ不満が時間差で爆発しやすい。`,work:`カウンセリング、看護・介護、秘書・調整役、イベント企画、研究・工芸など長くじっくり取り組む分野。`,advice:`熱量の向け先（燃料）と夢を持ち続ける。控えめになりすぎず意見を伝える習慣を。`},{read:`つちのえ`,image:`山`,keywords:[`堅実`,`包容力`,`忍耐力`,`現実的`,`器用`,`頑固`],nature:`どっしりとした山。安定感と包容力で周囲に安心と信頼を与える。数字やお金を大事にするリアリストで、決めたことは意地でも通す。`,wants:`頼られ、感謝され、認められること。貯えと安定した収入があり、心に余裕がある状態。`,weak:`弱みを見せられず抱え込む。変化への対応や決断が遅い。`,work:`管理者・まとめ役・教育者、法務・会計・行政など正確さが要る分野、表に出ないタイプの経営者。`,advice:`他者の意見や新しい考えを取り入れ、「守る」だけでなく「挑戦する」姿勢を持つ。`},{read:`つちのと`,image:`大地・田畑`,keywords:[`愛情深い`,`勉強熱心`,`思いやり`,`初志貫徹`,`吸収が早い`,`承認欲求`],nature:`作物を育てる大地。気配り上手で面倒見がよく、何かと「やってあげる側」に立つお母さんタイプ。コツコツ型で、無欲に見えて実は野心もある。`,wants:`さりげない気遣いや頑張りに気づき、褒めてもらうこと。ギブした分、甘えられる関係。`,weak:`自分を過小評価して不安になりやすい。慎重すぎて現状維持にとどまりがち。`,work:`十干で一番「教える」ことが得意。保育士・講師・塾や講座の先生、根気のいる仕事、地域に根差した働き方。`,advice:`具体的な目標と計画を立てる。一人の時間で本音を整理し、ギブアンドテイクを意識する。`},{read:`かのえ`,image:`剣・鋼`,keywords:[`決断力`,`突破力`,`頭脳明晰`,`正義感`,`白黒はっきり`,`頑固`],nature:`鍛えられた鋼。困難を切り開く行動力と決断力を持ち、合理的で無駄やグレーを嫌う。正義感が強く、経営者に最も多いとされる天干。`,wants:`叩かれ磨かれて成長できる環境、努力が正当に評価される世界。`,weak:`正論で斬って敵を作りやすい。柔軟性に欠け、他人にも自分と同じ厳しさを求める。`,work:`リーダー、経営者、営業職、エンジニア、ベンチャーなど挑戦が求められる環境。`,advice:`ぬるま湯に浸らず課題を持つ。誰かのために戦う使命感を持ち、時には仲間に頼る。`},{read:`かのと`,image:`宝石`,keywords:[`美意識`,`感受性`,`完璧主義`,`理想主義`,`ロマンチック`,`気配り`],nature:`磨かれた宝石。洗練された美意識と繊細な感性を持ち、本物しか認めない凛とした芯がある。上を目指すストイックさの一方、深く付き合うと天然な一面も。`,wants:`洗練された空間と、尊敬し合える本質的なパー 化の多い業界。`,love:`自由で楽しい関係を好み、依存しすぎない恋愛が理想。`},正財:{keywords:`誠実・慎重・安定・責任感・計画性`,summary:`コツコツ真面目に堅実に財を築く。数字に強く、先回りして計画する。`,work:`金融、経理、管理職、行政、法律関係。`,love:`誠実さと安定を重視。長く付き合えるパートナーを選ぶ。`},偏官:{keywords:`行動力・挑戦・カリスマ性・親分肌・運動`,summary:`行動と実行力の星。思い立ったら一直線に動く。`,work:`起業、フリーランス、独立した仕事、体を使う仕事。`,love:`独占欲が強く、相手をリードする恋愛。`},正官:{keywords:`社会貢献・品格・規律・責任感・礼儀`,summary:`真面目で責任感が強く、社会の秩序やルールを大切にする。`,work:`公務員、管理職、組織の中で信頼を積み上げる仕事。安定した環境が理想。`,love:`誠実さと安定を重視し、堅実で信頼できる関係を求める。`},偏印:{keywords:`好奇心・個性的・直感・発想力・占い`,summary:`独創性とひらめきの星。ルールに縛られない自由な環境で力を発揮する。`,work:`デザイナー、作家、音楽家、映像クリエイター、プログラマー、占い・スピリチュアル。`,love:`自由を求め、束縛は苦手。会話が楽しい相手を好む。`},印綬:{keywords:`知識・優しさ・学問・教育・論理的思考`,summary:`勉強家で研究熱心。書籍からじっくり知識を蓄え、目上の引き立てを受けやすい。`,work:`学問・研究・教育・医療・法律など理論的な思考が求められる仕事。`,love:`慎重で、じっくり相手を知ってから信頼関係を築く。`}},ar={比劫:`自我・自己防衛。多いほど「自分は自分、人は人」。`,食傷:`伝達・表現。自分を分かってほしい、伝えたいエネルギー。`,財:`現実性・情報収集力。目に見える結果や評価にこだわる。`,官:`計画性・自制心。組織の中で役割を果たすと喜びを感じる。`,印:`習得本能。知的好奇心と慎重さ、目上からの引き立て。`},or={比肩:{mark:`◎`,keywords:`決断・スタート・仕切り直し・出会い・転職`,text:`大切な時期。継続していたものが途切れたり始まったりする仕切り直しのタイミング。思い浮かんだことは書き留めておく。`},劫財:{mark:`△`,keywords:`目利き・情報収集・同時並行・副業運・散財注意`,text:`新しい選択肢が生まれ、迷いやすい。情報収集の時期として活かす。ストレスと体調に注意。`},食神:{mark:`◎`,keywords:`趣味・遊び・恋愛・出会い・才能発揮`,text:`ポジティブな運勢。楽しい時間とご縁が増える。気が抜けやすいのでうっかりミスに注意。`},傷官:{mark:`△`,keywords:`技術向上・資格・自己表現・言動注意`,text:`技術や経験が伸びる反面、消耗しやすい。衝突やすれ違いに注意し、自然や芸術に触れて回復を。`},偏財:{mark:`○`,keywords:`行動力・能力上昇・自己投資・社交運`,text:`忙しく活動的な時期。大役に抜擢されやすく、ビジネススキルが伸びる。コミュニケーションは丁寧に。`},正財:{mark:`◎`,keywords:`結果が出る・安定・パートナーシップ`,text:`頑張ってきた分の結果が出る平和な運勢。到達点として振り返り、次の方向性を計画する。`},偏官:{mark:`△`,keywords:`試練・学び・キャパオーバー・体調注意`,text:`試練を感じやすい時期。無理をせず休むことを優先し、起きたことは「学び」と捉える。`},正官:{mark:`◎`,keywords:`仕事運・評価・決断・合格・パートナー運`,text:`公私ともに巡り合わせがよい大吉運。評価されステップアップが望める。謙虚さを忘れずに。`},偏印:{mark:`△`,keywords:`変化・移動・イメージチェンジ・ひらめき`,text:`考え方や環境が変わりやすい時期。アイデアは出るが感情の起伏とストレスに注意。`},印綬:{mark:`○`,keywords:`完成・評価・勉強・準備運・引き立て`,text:`続けてきたことがひと段落する。休む・学ぶ・準備するのに良いタイミング。`}},sr={比肩:`対等な仲間。同じ目線で並んで走れるが、譲り合いは苦手。`,劫財:`競い合い、刺激し合うライバル的な存在。`,食神:`一緒にいると気楽で楽しい。素の自分を出せる相手。`,傷官:`感性を揺さぶる相手。鋭い指摘も出やすい。`,偏財:`世界を広げてくれる相手。人脈や遊びの縁を運ぶ。`,正財:`安心して大切にしたいと思える堅実な相手。`,偏官:`自分を動かし、鍛えてくれる刺激的な相手。`,正官:`尊敬でき、けじめを与えてくれる相手。`,偏印:`新しい視点やひらめきをくれる、少し不思議な相手。`,印綬:`学びや安心を与えてくれる、見守ってくれる相手。`},cr={子丑:{place:`北`,axis:`精神軸`,months:`12月・1月`,hours:`23:00〜3:00`,weak:`父親・上司・目上`,traits:[`努力家で情に厚い頑張り屋`,`若いころに苦労しやすい（大器晩成）`,`自立すると運気が上がる`,`目下に恵まれやすい初代運`,`学ぶことの大切さに気づくと一気に伸びる`]},寅卯:{place:`東`,axis:`行動軸`,months:`2月・3月`,hours:`3:00〜7:00`,weak:`母親・兄弟・友人`,traits:[`全天中殺で一番エネルギッシュ`,`猪突猛進で一途`,`目上に恵まれやすく後継ぎ運がある`,`ビジネスセンスがあり中年期以降に財力`,`攻めに強く守りが苦手`]},辰巳:{place:`天上`,axis:`心の軸`,months:`4月・5月`,hours:`7:00〜11:00`,weak:`自分自身の心・実行力`,traits:[`家系の枠からはみ出す個性的な人生`,`故郷を離れた方がよい`,`人を惹きつけ愛と財を引き寄せる`,`考えるより行動派の現実主義`,`一心不乱に打ち込める`]},午未:{place:`南`,axis:`精神軸`,months:`6月・7月`,hours:`11:00〜15:00`,weak:`子供・部下・目下`,traits:[`長寿で精神力とスタミナがある`,`優秀で若いうちから飛躍`,`整理整頓が得意で効率重視`,`どんな分野でもプロになれる`,`最後をまとめる末代運`]},申酉:{place:`西`,axis:`行動軸`,months:`8月・9月`,hours:`15:00〜19:00`,weak:`配偶者・支援者`,traits:[`行動力がありスタートダッシュが得意`,`新しい人脈を作るのが得意`,`社会での成功が早い`,`社交的で世渡り上手`,`自分にブレーキを掛けることが課題`]},戌亥:{place:`中央`,axis:`心の軸`,months:`10月・11月`,hours:`19:00〜23:00`,weak:`生き方・メンタル・人生の方向性`,traits:[`精神性が高くスピリチュアルや哲学が好き`,`表面は穏やかで内面は葛藤`,`洞察力・直観力に優れ繊細`,`親や家系から離れた方が開運しやすい`,`お金儲けに傾くと陰転`]}},lr=`天中殺は日柱の干支を作るときに余る2つの十二支。12年に2年、12か月に2か月、12日に2日巡り、「天からの恩恵を受けにくい」時期だが、自力で道を切り拓くにはもってこいの時期。心の声の蓋が開くときで、ここで起きたことは学習効果が大きい。`,ur={生年天中殺:`日柱の天中殺が年支にある。親に対して一方通行の違和感を抱きやすく、親元を離れることで開花する。常識の枠を超えた発想の持ち主。`,生月天中殺:`日柱の天中殺が月支にある。社会や時代の場所に不足があり、男性ははみ出し者的立場、女性は仕事や結婚が不安定になりやすいがドラマチックに成功しやすい。`,生日天中殺:`年柱の天中殺が日支にある。親から見て本人に違和感がある状態。親の価値観を引き継がない完全な独立心を持つ。`,日座天中殺:`日柱が甲戌または乙亥。「純粋な宿命天中殺」。現実世界で違和感を抱えやすいが、一風変わった環境でこそうまくいく。生家を出ると成功しやすい。`},dr=`宿命天中殺を持つ人は、巡ってくる天中殺の影響を受けにくい一方、波乱の多い人生になりやすい。苦労を乗り越える大きなエネルギーを持っている。`,fr={天乙貴人:{read:`てんおつきじん`,title:`幸運の星`,text:`吉星の中で最も吉意が強い。凶を吉に変える力があり、信頼と引き立てを受けやすい。支合で吉意が増し、冲で弱まる。`},太極貴人:{read:`たいきょくきじん`,title:`始まりと終わりの星`,text:`援助されやすく、目上に可愛がられ晩年運がよい。年柱にあると最も強く働く。`},福星貴人:{read:`ふくせいきじん`,title:`財運と物質運の星`,text:`生まれつきの財運と物質運。一時的に苦しくても乗り越えて金銭に恵まれる。冲で吉意が弱まる。`},天厨貴人:{read:`てんちゅうきじん`,title:`衣食住の星`,text:`衣食住に恵まれ、飲食との縁が深い。出世運と人間関係にも恵まれる。`},天官貴人:{read:`てんかんきじん`,title:`名誉や出世運の星`,text:`物事をスムーズに運ぶ力があり、組織では順調に出世しやすい。`},文昌貴人:{read:`ぶんしょうきじん`,title:`才能と人徳の星`,text:`知識が豊富で、芸術や文学、特に文章の才能に恵まれる。`},暗禄:{read:`あんろく`,title:`隠れた幸運や金運の星`,text:`気付かぬうちに助けられ、臨時収入や不意の幸運に恵まれる。社交的で引き立て運も。`},金与禄:{read:`きんよろく`,title:`強力な金運の星`,text:`生まれつきの強い財運。明るく穏やかで良縁に恵まれやすく、家庭円満になりやすい。`},羊刃:{read:`ようじん`,title:`強烈なエネルギーの凶星`,text:`自我を強める。身旺だと気性が荒くなりやすいが、身弱には自分を強める吉となる。偏官があると出世運・財運に。`},飛刃:{read:`ひじん`,title:`起伏の激しい凶星`,text:`刺激や勝負事を好み熱しやすく冷めやすい。ギャンブルに注意。身弱には吉となる。`},紅艶:{read:`こうえん`,title:`愛嬌の星`,text:`親しみやすさと色気で好かれる人気者。モテるゆえの異性トラブルに注意。`},流霞殺:{read:`りゅうかさつ`,title:`お酒に溺れる凶星`,text:`繊細で体調を崩しやすい。感受性が強く理想が高い。創作活動で才能を活かすと安定する。`},血刃:{read:`けつじん`,title:`血に関係した災いを暗示`,text:`怪我・病気・手術・事故など血を見る出来事への注意。健康や運転に気をつける。`},囚獄:{read:`しゅうごく`,title:`囚われることを暗示`,text:`トラブルに巻き込まれやすい。行動が制限されやすい芸能人にも多い。`},劫殺:{read:`ごうさつ`,title:`外からの災いを暗示`,text:`吉凶がはっきり分かれる。吉に働けば用意周到で頭の回転が速い切れ者に。`},孤辰:{read:`こしん`,title:`孤独を暗示する星`,text:`親族との縁が薄くなりやすいが、孤独に耐える強い精神力を養う。吉星と共にあると凶作用が出にくい。`},寡宿:{read:`かしゅく`,title:`孤独を暗示する星`,text:`親族、特に父親との縁が薄くなりやすい。その経験が自立心を養う。`},華蓋:{read:`かがい`,title:`芸術性や孤独性の星`,text:`学問・芸術の才能に恵まれる。心に孤独感を抱えやすい。印綬と共にあるとさらに芸術性が高まる。`},咸池:{read:`かんち`,title:`異性を惹きつける星`,text:`桃花殺とも。明るく社交的な人気者で恋愛が華やかになりやすい。恋愛トラブルに注意。`},駅馬:{read:`えきば`,title:`移動や環境変化の星`,text:`行動力があり環境の変化に強い。旅行・転職・引っ越しが多く、海外や遠方での活躍も。`},亡神:{read:`ぼうじん`,title:`内部からの災いを暗示`,text:`思慮深く洞察力に優れる。学問・研究・芸術に向く。意識的に交流を大切にすると開運。`},白虎:{read:`びゃっこ`,title:`病気や事故を暗示`,text:`健康管理が重要。生命力は強いので、規則正しい生活とストレス管理が開運の鍵。`}},pr=[{virtue:`仁`,personality:`情に厚く親切で優しい人情家。若々しく前進する気持ちが大きい。思い通りにいかないとイライラしやすい。`,organ:`肝（胆）・目・爪・筋肉`,emotion:`怒（イライラ）`,taste:`酸味・緑`,foods:`青菜、ブロッコリー、梅干し、酢の物、レモン、セロリ、シジミ`,signs:`頭痛・のぼせ・目の疲れ・不眠・自律神経`},{virtue:`礼`,personality:`陽気で明るく情熱的。礼儀と秩序を大事にし、言語能力に長ける。好不調の差が激しい。`,organ:`心（小腸）・舌・血管`,emotion:`喜（興奮）`,taste:`苦味・赤`,foods:`トマト、にんじん、スイカ、夏野菜、春菊、よもぎ、赤味噌`,signs:`動悸・冷えのぼせ・熱中症・血圧`},{virtue:`信`,personality:`人情味と包容力があり、忍耐強くコツコツ積み重ねる。慎重で信頼を得やすいが、現状維持に固執しがち。`,organ:`脾（胃）・口・唇`,emotion:`思（クヨクヨ）`,taste:`甘味・黄`,foods:`かぼちゃ、さつまいも、とうもろこし、玉ねぎ、キャベツ、味噌汁`,signs:`消化不良・胃腸・口内炎・肩こり`},{virtue:`義`,personality:`冷静で理性的、合理的。白黒つけたがり、一旦決めたら貫く。正義感が強く競争の場で活躍する。`,organ:`肺（大腸）・鼻・皮膚`,emotion:`悲（メソメソ）`,taste:`辛味・白`,foods:`大根、里芋、レンコン、ネギ、梨、玄米、ショウガ`,signs:`咳・鼻・喉・便秘・皮膚トラブル`},{virtue:`智`,personality:`臨機応変で知的、博学。物腰柔らかく見えて内心は勝ち負けにこだわる。先読みしすぎてネガティブになりやすい。`,organ:`腎（膀胱）・耳・骨`,emotion:`恐（怖がる）`,taste:`鹹味（塩辛い）・黒`,foods:`海藻、貝類、黒ゴマ、黒豆、蕎麦、クルミ、小豆`,signs:`冷え・むくみ・腰痛・耳・骨`}],mr={身旺:`日主のエネルギーが強い状態。比劫と印が多い。自分は自分という軸があり、打たれ強く、現状維持がストレスになる。お世辞や忖度は苦手。`,身弱:`日主のエネルギーが弱い状態。食傷・財・官が多い。周りの影響を受けやすく理想主義的だが、協調性や共感力として活きる。`,中和:`日主を支える力と漏らす力が拮抗している状態。状況に応じて身旺・身弱どちらの面も出る。`},hr={甲戌:`通常異常干支。鬼教官星。合理的で穏やかな印象だが死ぬほど頑固。本当はピュアな甘えん坊で、遠慮なく甘えられる相手を持つとよい。`,乙亥:`通常異常干支。繊細ヤクザ。人を喜ばせることに生きがいを感じるが、決めたら絶対に譲らない。普通の結婚の形に捉われない方がのびのびできる。`,戊戌:`通常異常干支。生粋の職人。周囲と馴染みにくい独自の価値観を持ち、忍耐強く信念を貫く。磨き続ける「技」の世界で強みを発揮。`,庚子:`通常異常干支。頭の回る戦士。勘の良さと数字の強さを持つ。甘やかしで運気が下がるため、揉まれる環境の方が伸びる。`,辛亥:`通常異常干支。鋭い感性と言葉を持つ一方、ガラスのハート。自分の感性のままにアウトプットすると新しい時代を切り開く。`,丁巳:`通常異常干支。家業とは異なる分野で独立して栄える。物静かに見えて内に秘めた情熱は誰よりも強い。`,辛巳:`暗号異常干支。霊感が強く、高い美意識とストイックさを持つ。芸能・芸術の道もおすすめ。意識的にリラックスを。`,壬午:`暗号異常干支。好奇心旺盛な人気者で突発的な行動が多い。人並み外れたアイデアマン。自由に動ける環境で活きる。`,丙戌:`暗号異常干支。無邪気な明るさとストイックさを併せ持つ。親の干渉で運気が下がりやすい。成長を認めてくれる存在が身近にいるとよい。`,丁亥:`暗号異常干支。鋭い五感と洞察力を持つ。他人のエネルギーを吸いやすいので、美しいものに焦点を当てると心地よい。`,戊子:`暗号異常干支。お金や損得へのアンテナが常人の何倍も鋭い。プラスに働くと商売・蓄財の天才。`,癸巳:`暗号異常干支。環境に合わせて人格が変化する。相手の幸せを自分の幸せとする優しさと、一点集中の深い愛情。`,己亥:`暗号異常干支。霊感体質で非常に器用な天才型。普段は柔軟だが、一度決めたら曲げない頑固な野心家。`},gr={santoku:`運勢バランスに優れ、順調な社会生活を送りやすい。1人で何でもできる傾向（器用貧乏になりやすい）。失敗を恐れて動けなくなることも。`,gotoku:`運勢バランスがとても優れ、順調な社会生活を送りやすい。社会性のあるオールラウンダーなジェネラリスト。`,劫局:`八相局で最もパワーの強い星。大胆に動き、海外を主戦場にすると本来の力を発揮。参謀的ポジションに向く策略家。`,食局:`知能指数が高く、研究・芸術面の才能。食へのこだわりが強い。大成功かヒモかの二択。`,財局:`運でいつの間にかお金持ちになる人が多いが、お金に執着するとうまくいかない。営業職や投資家向き。人に流されやすい。`,官局:`行動力があり一度決めたことをとことん追求する。先祖からの因縁が深い。体力があり体を使う仕事にも向く。`,印局:`探られるのを極端に嫌う秘密主義。自分の世界観を大切にし、斬新なアイデアを生む。企画・開発・研究職向き。`},_r=[{name:`夜明け`,image:`新しい芽が顔を出す`,text:`新しいことに挑戦し運気が好転。環境を変える、引っ越し・転職も。受け身はNG。`},{name:`進化`,image:`成長した新緑`,text:`才能を伸ばし仕事面で飛躍。学びとスキル取得、前向きな人との付き合いを。`},{name:`決意`,image:`美しい花が咲く`,text:`迷いを
