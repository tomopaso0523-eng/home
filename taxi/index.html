<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F9FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="送迎メモ">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>送迎お小遣いメモ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#F5F9FF;
    --card:#FFFFFF;
    --blue:#2379ED;
    --blue-light:#4D9CFF;
    --ink:#193B60;
    --sub:#66809A;
    --line:rgba(25,59,96,.08);
    --sync-bg:#E7FBF3;
    --sync-ink:#14845A;
    --danger:#E95C63;
    --danger-bg:#FDEEEF;
    --glass:rgba(255,255,255,.62);
    --glass-strong:rgba(255,255,255,.82);
    --glass-border:rgba(255,255,255,.75);
    --edge:rgba(35,121,237,.12);
    --shadow:0 8px 24px rgba(30,80,150,.08), 0 1px 2px rgba(30,80,150,.06);
    --hi:inset 0 1px 0 rgba(255,255,255,.9);
    --r-lg:25px; --r-md:20px; --r-sm:14px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 520px at 12% -8%, rgba(77,156,255,.22), transparent 60%),
      radial-gradient(700px 480px at 100% 18%, rgba(35,121,237,.14), transparent 60%),
      radial-gradient(800px 600px at 40% 110%, rgba(140,200,255,.20), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid rgba(35,121,237,.55);outline-offset:2px}
  .tnum{font-variant-numeric:tabular-nums}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

  .shell{
    max-width:640px;margin:0 auto;min-height:100vh;
    padding:0 calc(16px + var(--safe-r)) calc(28px + var(--safe-b)) calc(16px + var(--safe-l));
  }

  /* ---------- header ---------- */
  .nav{
    position:sticky;top:0;z-index:20;
    margin:0 calc(-16px - var(--safe-r)) 0 calc(-16px - var(--safe-l));
    padding:calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
    background:rgba(245,249,255,.68);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
  }
  .app-icon{
    width:40px;height:40px;border-radius:12px;flex:none;
    display:grid;place-items:center;color:#fff;
    background:linear-gradient(145deg,var(--blue-light),var(--blue));
    box-shadow:0 4px 12px rgba(35,121,237,.35), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .nav-text{min-width:0;flex:1}
  .nav-sub{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:.02em;line-height:1.2}
  .nav-title{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sync{
    flex:none;display:inline-flex;align-items:center;gap:6px;
    padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;
    background:#EEF3F9;color:var(--sub);border:1px solid rgba(255,255,255,.8);
  }
  .sync .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .sync[data-state="live"]{background:var(--sync-bg);color:var(--sync-ink)}
  .sync[data-state="live"] .dot{animation:pulse 2.4s ease-in-out infinite}
  .sync[data-state="error"]{background:var(--danger-bg);color:#C9414A}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  main{display:flex;flex-direction:column;gap:14px;padding-top:14px}

  /* ---------- segmented ---------- */
  .seg{
    display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;
    border-radius:999px;background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
    border:1px solid var(--glass-border);box-shadow:var(--shadow),var(--hi);
  }
  .seg button{
    border:0;background:transparent;border-radius:999px;min-height:42px;
    font-size:15px;font-weight:700;color:var(--sub);
    transition:background .2s,color .2s,transform .12s;
  }
  .seg button[aria-pressed="true"]{
    color:#fff;background:linear-gradient(180deg,var(--blue-light),var(--blue));
    box-shadow:0 4px 12px rgba(35,121,237,.32), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .seg button[aria-pressed="true"]::before{content:"✓ ";font-size:12px}
  .seg button:active{transform:scale(.97)}

  /* ---------- total card ---------- */
  .total{
    position:relative;overflow:hidden;border-radius:var(--r-lg);
    padding:18px 20px 16px;color:#fff;
    background:linear-gradient(135deg,#3C93FF 0%,#2379ED 52%,#1B67D6 100%);
    box-shadow:0 14px 32px rgba(35,121,237,.30), inset 0 1px 0 rgba(255,255,255,.35);
    isolation:isolate;
  }
  .total::before{ /* light band */
    content:"";position:absolute;inset:-40% -10% auto -10%;height:120%;z-index:-1;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 48%,transparent 62%);
  }
  .orb{position:absolute;border-radius:50%;z-index:-1;pointer-events:none;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.38),rgba(255,255,255,0) 70%)}
  .orb.a{width:180px;height:180px;right:-50px;top:-60px}
  .orb.b{width:120px;height:120px;left:-40px;bottom:-60px;opacity:.7}
  .total-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .total-label{font-size:15px;font-weight:700;opacity:.95}
  .badge{
    flex:none;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .total-amount{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 6px}
  .total-amount .yen{font-size:.62em;margin-right:2px;opacity:.95}
  .total-meta{font-size:13px;font-weight:600;opacity:.88;display:flex;align-items:center;gap:6px}

  /* ---------- section heading ---------- */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 4px 0}
  .sec-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
  .sec-head span{font-size:13px;font-weight:600;color:var(--sub)}

  /* ---------- action buttons ---------- */
  .actions{display:flex;flex-direction:column;gap:10px}
  .act{
    width:100%;min-height:5rem;border-radius:var(--r-md);
    display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;text-align:left;
    border:1px solid var(--glass-border);
    background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(236,245,255,.78));
    -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
    box-shadow:var(--shadow),var(--hi), inset 0 0 0 1px var(--edge);
    transition:transform .12s ease, box-shadow .2s;
    touch-action:manipulation;
  }
  .act:active{transform:scale(.975)}
  .act[disabled]{opacity:.5;cursor:not-allowed}
  .act .sym{
    width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;
    font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--blue);
    background:linear-gradient(180deg,#fff,#E3EFFF);
    box-shadow:inset 0 1px 0 #fff, inset 0 0 0 1px rgba(35,121,237,.14), 0 2px 6px rgba(35,121,237,.12);
  }
  .act .mid{flex:1;min-width:0}
  .act .lbl{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .act .hint{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-top:2px}
  .act .amt{flex:none;display:flex;align-items:center;gap:2px;font-size:19px;font-weight:800;color:var(--blue)}
  .act .amt svg{opacity:.55}
  .act.shin{
    background:linear-gradient(180deg,rgba(232,242,255,.95),rgba(207,227,255,.82));
    box-shadow:var(--shadow),var(--hi), inset 0 0 0 1px rgba(35,121,237,.2);
  }
  .act.shin .sym{background:linear-gradient(180deg,#F4F9FF,#CFE3FF)}
  .act.other{
    color:#fff;border-color:rgba(255,255,255,.35);
    background:linear-gradient(135deg,var(--blue-light),var(--blue));
    box-shadow:0 10px 24px rgba(35,121,237,.30), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .act.other .sym{color:#fff;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 0 0 1px rgba(255,255,255,.3)}
  .act.other .hint{color:rgba(255,255,255,.85)}
  .act.other .amt{color:#fff;font-size:16px}
  .act.other .amt svg{opacity:.8}
  .readonly-note{font-size:13px;color:var(--sub);text-align:center;margin:-2px 0 0}

  /* ---------- history ---------- */
  .list{
    list-style:none;margin:0;padding:0;border-radius:var(--r-md);overflow:hidden;
    background:var(--glass-strong);
    -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
    border:1px solid var(--glass-border);box-shadow:var(--shadow),var(--hi);
  }
  .row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;position:relative}
  .row + .row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
  .row.pending{opacity:.6}
  .row .ic{
    width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;color:var(--blue);
    background:linear-gradient(180deg,#F2F8FF,#DDEBFF);box-shadow:inset 0 0 0 1px rgba(35,121,237,.1);
  }
  .row .info{flex:1;min-width:0}
  .row .name{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .when{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--sub);margin-top:2px;font-weight:500;flex-wrap:wrap}
  .row .who{color:var(--sub)}
  .row .yen{flex:none;font-size:17px;font-weight:800;color:var(--blue)}
  .del{
    flex:none;width:40px;height:40px;border-radius:12px;border:0;display:grid;place-items:center;
    background:var(--danger-bg);color:var(--danger);transition:transform .12s;
  }
  .del:active{transform:scale(.92)}
  .empty,.loading{
    padding:28px 16px;text-align:center;color:var(--sub);font-size:14px;font-weight:600;
  }
  .empty .big{font-size:28px;margin-bottom:6px;opacity:.6}
  .shimmer{height:14px;border-radius:7px;margin:10px auto;max-width:70%;
    background:linear-gradient(90deg,#E8F0FB 0%,#F6FAFF 50%,#E8F0FB 100%);background-size:200% 100%;
    animation:sh 1.6s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}

  /* ---------- dialog ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;
    background:rgba(20,45,80,.26);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    padding:0 calc(8px + var(--safe-r)) calc(8px + var(--safe-b)) calc(8px + var(--safe-l));
  }
  .overlay.open{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}}
  .sheet{
    width:100%;max-width:520px;border-radius:28px;padding:20px 18px 18px;
    background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 24px 60px rgba(20,60,120,.25), var(--hi);
    animation:up .24s cubic-bezier(.2,.9,.3,1.1);
    max-height:calc(100vh - 24px);overflow:auto;
  }
  @keyframes up{from{transform:translateY(24px);opacity:.6}}
  @media (min-width:700px){ .overlay{align-items:center} }
  .sheet .kicker{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.04em}
  .sheet h3{margin:2px 0 14px;font-size:22px;font-weight:800}
  .field{display:block;margin-bottom:12px}
  .field > span{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:0 0 6px 4px}
  .field input{
    width:100%;height:52px;border-radius:var(--r-sm);padding:0 14px;font-size:18px;font-weight:600;
    border:1px solid rgba(35,121,237,.18);background:rgba(245,249,255,.9);outline:none;
    box-shadow:inset 0 1px 2px rgba(25,59,96,.06);
  }
  .field input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(35,121,237,.14)}
  .field input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 4px rgba(233,92,99,.14)}
  .amount-wrap{position:relative}
  .amount-wrap .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:700;color:var(--sub)}
  .amount-wrap input{padding-left:34px}
  .err{min-height:18px;font-size:13px;font-weight:600;color:#C9414A;margin:2px 4px 0}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 16px}
  .chip{
    height:42px;border-radius:12px;border:1px solid rgba(35,121,237,.16);
    background:linear-gradient(180deg,#fff,#EEF5FF);font-size:14px;font-weight:700;color:var(--blue);
    transition:transform .12s;
  }
  .chip:active{transform:scale(.95)}
  .chip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{height:54px;border-radius:16px;border:0;font-size:17px;font-weight:800;transition:transform .12s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#EAF1FA;color:var(--ink)}
  .btn.primary{color:#fff;background:linear-gradient(180deg,var(--blue-light),var(--blue));box-shadow:0 6px 16px rgba(35,121,237,.3)}

  /* ---------- toast ---------- */
  .toasts{position:fixed;left:0;right:0;bottom:calc(16px + var(--safe-b));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
  body.dlg-open .toasts{bottom:auto;top:calc(12px + var(--safe-t))}
  .toast{
    pointer-events:auto;max-width:440px;width:100%;display:flex;align-items:center;gap:10px;
    padding:12px 12px 12px 16px;border-radius:16px;font-size:14px;font-weight:700;
    background:rgba(25,59,96,.92);color:#fff;
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    box-shadow:0 10px 30px rgba(20,50,90,.3);animation:up .22s ease;
  }
  .toast.error{background:rgba(201,65,74,.95)}
  .toast .msg{flex:1}
  .toast button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px}

  @media (max-width:360px){
    .act .lbl{font-size:18px}
    .total-amount{font-size:38px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="nav">
    <div class="app-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
    </div>
    <div class="nav-text">
      <div class="nav-sub">お父さんと共有中</div>
      <h1 class="nav-title" style="margin:0">送迎お小遣いメモ</h1>
    </div>
    <div class="sync" id="sync" data-state="connecting" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="syncText">接続中</span>
    </div>
  </header>

  <main>
    <nav class="seg" id="seg" aria-label="表示する月"></nav>

    <section class="total" aria-live="polite" id="totalCard">
      <span class="orb a"></span><span class="orb b"></span>
      <div class="total-top">
        <div class="total-label" id="totalLabel"></div>
        <div class="badge">過去3ヶ月</div>
      </div>
      <div class="total-amount tnum" id="totalAmount"><span class="yen">¥</span>0</div>
      <div class="total-meta" id="totalMeta"></div>
    </section>

    <div class="sec-head"><h2>記録する</h2><span>車内でも押しやすく</span></div>
    <div class="actions">
      <button type="button" class="act" id="btnSenri">
        <span class="sym tnum" aria-hidden="true">500</span>
        <span class="mid"><span class="lbl">【千里中央】</span><span class="hint">ワンタップで記録</span></span>
        <span class="amt tnum">¥500<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>
      <button type="button" class="act shin" id="btnShin">
        <span class="sym" aria-hidden="true">1K</span>
        <span class="mid"><span class="lbl">【新大阪】</span><span class="hint">ワンタップで記録</span></span>
        <span class="amt tnum">¥1,000<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>
      <button type="button" class="act other" id="btnOther" aria-haspopup="dialog">
        <span class="sym" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        <span class="mid"><span class="lbl">【その他】</span><span class="hint">金額と項目名を入力</span></span>
        <span class="amt">入力<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>
    </div>
    <p class="readonly-note" id="roNote" hidden>閲覧のみの権限です。記録・削除はできません。</p>

    <div class="sec-head" style="margin-top:6px"><h2>記録履歴</h2><span id="histMonth"></span></div>
    <ul class="list" id="list" aria-label="記録履歴"></ul>
  </main>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" novalidate>
    <div class="kicker">新しい記録</div>
    <h3 id="dlgTitle">【その他】を記録</h3>
    <label class="field"><span>項目名</span>
      <input id="inLabel" type="text" maxlength="40" value="その他" autocomplete="off" enterkeyhint="next">
    </label>
    <label class="field"><span>金額（円）</span>
      <div class="amount-wrap"><span class="pre">¥</span>
        <input id="inAmount" type="number" inputmode="numeric" pattern="[0-9]*" min="1" step="1" placeholder="0" autocomplete="off" enterkeyhint="done" aria-describedby="amtErr">
      </div>
      <div class="err" id="amtErr" role="alert"></div>
    </label>
    <div class="chips" id="chips" aria-label="クイック金額"></div>
    <div class="btns">
      <button type="button" class="btn ghost" id="btnCancel">キャンセル</button>
      <button type="submit" class="btn primary">記録する</button>
    </div>
  </form>
</div>

<div class="toasts" id="toasts" aria-live="assertive"></div>

<script>
(() => {
  "use strict";

  /* ===== 定数（必須ラベル・金額は変更しない） ===== */
  const FIXED = {
    senri: { label: "【千里中央】", amount: 500 },
    shin:  { label: "【新大阪】",   amount: 1000 },
  };
  const QUICK = [300, 500, 800, 1000, 1500, 2000, 3000, 5000];
  const MAX_AMOUNT = 1000000;

  /* ===== 状態 ===== */
  const state = {
    rides: [],          // {id,label,amount,recordedAt,recordedBy,pending}
    loaded: false,
    sel: null,          // {y, m}  m=1..12
    canWrite: true,
    names: {},
  };
  let db = null, user = null, myId = null;
  const hidden = new Map();   // id -> ride（削除直後の楽観的非表示）
  const ghosts = new Map();   // id -> ride（追加直後の楽観的表示）

  /* ===== util ===== */
  const $ = (id) => document.getElementById(id);
  const yen = (n) => "¥" + Number(n).toLocaleString("ja-JP");
  const pad = (n) => String(n).padStart(2, "0");
  const fmtWhen = (ms) => { const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const buzz = () => { try { if (typeof navigator !== "undefined" && "vibrate" in navigator) navigator.vibrate(8); } catch (_) {} };

  function months() {
    const now = new Date(); const out = [];
    for (let i = 0; i < 3; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      out.push({ y: d.getFullYear(), m: d.getMonth() + 1 });
    }
    return out; // [今月, 先月, 2ヶ月前]
  }
  const monthRange = ({ y, m }) => [new Date(y, m - 1, 1).getTime(), new Date(y, m, 1).getTime()];
  const windowStart = () => { const ms = months(); return monthRange(ms[2])[0]; };

  function svg(path, size = 16, sw = 2.2) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", sw);
    s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = path; return s;
  }
  const ICON_CAR = '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>';
  const ICON_CLOCK = '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>';
  const ICON_TRASH = '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6M14 11v6"/>';

  /* ===== toast ===== */
  function toast(msg, opts = {}) {
    const el = document.createElement("div");
    el.className = "toast" + (opts.error ? " error" : "");
    const t = document.createElement("span"); t.className = "msg"; t.textContent = msg; el.appendChild(t);
    if (opts.action) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = opts.action.label;
      b.addEventListener("click", () => { opts.action.run(); el.remove(); }); el.appendChild(b);
    }
    $("toasts").appendChild(el);
    while ($("toasts").children.length > 3) $("toasts").firstChild.remove();
    setTimeout(() => el.remove(), opts.ms || (opts.action ? 5000 : 2600));
  }

  /* ===== sync indicator ===== */
  function setSync(s) {
    const el = $("sync"); el.dataset.state = s;
    $("syncText").textContent = { live: "同期中", connecting: "接続中", error: "未接続", offline: "オフライン" }[s] || "接続中";
  }

  /* ===== render ===== */
  function visibleRides() {
    const map = new Map();
    for (const r of state.rides) map.set(r.id, r);
    for (const [id, r] of ghosts) if (!map.has(id)) map.set(id, { ...r, pending: true });
    for (const id of hidden.keys()) map.delete(id);
    return [...map.values()];
  }

  function renderSeg() {
    const seg = $("seg"); seg.textContent = "";
    for (const mo of months()) {
      const b = document.createElement("button"); b.type = "button";
      const on = state.sel && mo.y === state.sel.y && mo.m === state.sel.m;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.textContent = `${mo.m}月`;
      b.setAttribute("aria-label", `${mo.y}年${mo.m}月`);
      b.addEventListener("click", () => { state.sel = mo; render(); });
      seg.appendChild(b);
    }
  }

  function render() {
    const ms = months();
    if (!state.sel || !ms.some(x => x.y === state.sel.y && x.m === state.sel.m)) state.sel = ms[0];
    renderSeg();
    const [from, to] = monthRange(state.sel);
    const rows = visibleRides()
      .filter(r => r.recordedAt >= from && r.recordedAt < to)
      .sort((a, b) => b.recordedAt - a.recordedAt);
    const total = rows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const ym = `${state.sel.y}年${state.sel.m}月`;

    $("totalLabel").textContent = `${ym}の合計：`;
    const amt = $("totalAmount"); amt.textContent = "";
    const yS = document.createElement("span"); yS.className = "yen"; yS.textContent = "¥";
    amt.append(yS, document.createTextNode(total.toLocaleString("ja-JP")));
    $("totalCard").setAttribute("aria-label", `${ym}の合計：${yen(total)}`);
    $("totalMeta").textContent = state.loaded ? `${rows.length}件の記録・自動同期` : "読み込み中…";
    $("histMonth").textContent = ym;

    const list = $("list"); list.textContent = "";
    if (!state.loaded && !db) {
      const li = document.createElement("li"); li.className = "loading";
      li.innerHTML = '<div class="shimmer"></div><div class="shimmer" style="max-width:50%"></div>';
      list.appendChild(li); return;
    }
    if (!rows.length) {
      const li = document.createElement("li"); li.className = "empty";
      const big = document.createElement("div"); big.className = "big"; big.appendChild(svg(ICON_CAR, 30, 1.8));
      const t = document.createElement("div"); t.textContent = state.loaded ? `${ym}の記録はまだありません` : "読み込み中…";
      li.append(big, t); list.appendChild(li); return;
    }
    for (const r of rows) {
      const li = document.createElement("li"); li.className = "row" + (r.pending ? " pending" : "");
      const ic = document.createElement("div"); ic.className = "ic"; ic.appendChild(svg(ICON_CAR, 18));
      const info = document.createElement("div"); info.className = "info";
      const nm = document.createElement("div"); nm.className = "name"; nm.textContent = r.label || "その他"; nm.title = r.label || "";
      const wh = document.createElement("div"); wh.className = "when tnum";
      wh.append(svg(ICON_CLOCK, 13), document.createTextNode(fmtWhen(r.recordedAt)));
      const who = r.recordedBy && state.names[r.recordedBy];
      if (who) { const w = document.createElement("span"); w.className = "who"; w.textContent = "・" + who; wh.appendChild(w); }
      info.append(nm, wh);
      const y = document.createElement("div"); y.className = "yen tnum"; y.textContent = yen(r.amount);
      li.append(ic, info, y);
      if (state.canWrite) {
        const del = document.createElement("button"); del.type = "button"; del.className = "del";
        del.setAttribute("aria-label", `${r.label} ${yen(r.amount)}（${fmtWhen(r.recordedAt)}）を削除`);
        del.appendChild(svg(ICON_TRASH, 18));
        del.addEventListener("click", () => removeRide(r));
        li.appendChild(del);
      }
      list.appendChild(li);
    }
    resolveNames(rows);
  }

  let nameReq = 0;
  async function resolveNames(rows) {
    if (!user || !user.profiles) return;
    const ids = [...new Set(rows.map(r => r.recordedBy).filter(Boolean))];
    if (!ids.length) return;
    const my = ++nameReq;
    try {
      const ps = await user.profiles(ids);
      if (my !== nameReq) return;
      let changed = false;
      for (const id of ids) {
        const n = (ps[id] && ps[id].name) || "";
        if (n && state.names[id] !== n) { state.names[id] = n; changed = true; }
      }
      if (changed) render();
    } catch (_) {}
  }

  /* ===== data ops（楽観的更新 + 失敗時ロールバック） ===== */
  function validAmount(v) {
    const s = String(v ?? "").trim();
    if (!/^\d+$/.test(s)) return null;
    const n = parseInt(s, 10);
    return Number.isSafeInteger(n) && n > 0 && n <= MAX_AMOUNT ? n : null;
  }

  async function addRide(label, amount) {
    if (!db) { toast("データベースに接続できていません", { error: true }); return false; }
    if (!state.canWrite) { toast("閲覧のみの権限です", { error: true }); return false; }
    const now = Date.now();
    const ref = db.collection("rides").doc();
    const body = { label: String(label).slice(0, 40), amount, recordedAt: now, recordedBy: myId || null, createdAt: now };
    ghosts.set(ref.id, { id: ref.id, ...body });
    // 記録した月を表示
    const d = new Date(now); state.sel = { y: d.getFullYear(), m: d.getMonth() + 1 };
    render();
    try {
      await ref.set(body);
      return true;
    } catch (e) {
      ghosts.delete(ref.id); render();
      toast(e && e.code === "invalid_argument" ? "記録する権限がありません" :
            e && e.code === "quota_exceeded" ? "保存容量の上限に達しました" : "記録に失敗しました。もう一度お試しください", { error: true });
      if (e && e.code === "invalid_argument") { state.canWrite = false; applyWriteState(); }
      return false;
    } finally {
      setTimeout(() => { ghosts.delete(ref.id); render(); }, 15000);
    }
  }

  async function removeRide(r) {
    if (!db) return;
    hidden.set(r.id, r); render();
    try {
      await db.collection("rides").doc(r.id).delete();
      toast(`${r.label} ${yen(r.amount)} を削除しました`, {
        action: { label: "元に戻す", run: () => restore(r) }
      });
    } catch (e) {
      toast("削除に失敗しました", { error: true });
    } finally {
      setTimeout(() => { hidden.delete(r.id); render(); }, 4000);
    }
  }

  async function restore(r) {
    hidden.delete(r.id);
    const body = { label: r.label, amount: r.amount, recordedAt: r.recordedAt, recordedBy: r.recordedBy || null, createdAt: r.createdAt || r.recordedAt };
    ghosts.set(r.id, { id: r.id, ...body }); render();
    try { await db.collection("rides").doc(r.id).set(body); toast("元に戻しました"); }
    catch (_) { ghosts.delete(r.id); render(); toast("元に戻せませんでした", { error: true }); }
  }

  /* ===== fixed buttons ===== */
  function oneTap(key) {
    const f = FIXED[key];
    buzz();
    addRide(f.label, f.amount).then(ok => { if (ok) toast(`${f.label} ${yen(f.amount)} を記録しました`); });
  }
  $("btnSenri").addEventListener("click", () => oneTap("senri"));
  $("btnShin").addEventListener("click", () => oneTap("shin"));

  /* ===== その他 dialog ===== */
  const overlay = $("overlay"), inLabel = $("inLabel"), inAmount = $("inAmount"), amtErr = $("amtErr");
  let lastFocus = null;
  const chips = $("chips");
  for (const v of QUICK) {
    const c = document.createElement("button"); c.type = "button"; c.className = "chip tnum";
    c.textContent = v.toLocaleString("ja-JP"); c.setAttribute("aria-label", `${v}円`); c.dataset.v = v;
    c.addEventListener("click", () => { inAmount.value = v; syncChips(); clearErr(); });
    chips.appendChild(c);
  }
  function syncChips() { for (const c of chips.children) c.setAttribute("aria-pressed", String(c.dataset.v) === String(inAmount.value) ? "true" : "false"); }
  function clearErr() { amtErr.textContent = ""; inAmount.removeAttribute("aria-invalid"); }
  inAmount.addEventListener("input", () => { syncChips(); clearErr(); });

  function openDlg() {
    lastFocus = document.activeElement;
    inLabel.value = "その他"; inAmount.value = ""; clearErr(); syncChips();
    overlay.classList.add("open"); overlay.setAttribute("aria-hidden", "false"); document.body.classList.add("dlg-open");
    setTimeout(() => inAmount.focus(), 60);
  }
  function closeDlg() {
    overlay.classList.remove("open"); overlay.setAttribute("aria-hidden", "true"); document.body.classList.remove("dlg-open");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $("btnOther").addEventListener("click", openDlg);
  $("btnCancel").addEventListener("click", closeDlg);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeDlg(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && overlay.classList.contains("open")) closeDlg(); });
  $("sheet").addEventListener("submit", async (e) => {
    e.preventDefault();
    const raw = inAmount.value;
    const n = validAmount(raw);
    if (n === null) {
      const msg = String(raw).trim() === "" ? "金額を入力してください" :
                  Number(raw) <= 0 ? "1円以上の金額を入力してください" :
                  Number(raw) > MAX_AMOUNT ? "金額が大きすぎます" : "正の整数で入力してください";
      amtErr.textContent = msg; inAmount.setAttribute("aria-invalid", "true"); inAmount.focus();
      toast(msg, { error: true });
      return;
    }
    const label = inLabel.value.trim() || "その他";
    closeDlg(); buzz();
    const ok = await addRide(label, n);
    if (ok) toast(`${label} ${yen(n)} を記録しました`);
  });

  function applyWriteState() {
    for (const id of ["btnSenri", "btnShin", "btnOther"]) $(id).disabled = !state.canWrite;
    $("roNote").hidden = state.canWrite;
    render();
  }

  /* ===== 起動 ===== */
  render();

  /* ===== 共有データベース（Supabase） =====
     URL と Publishable key は公開しても安全なキー。
     読み書きは「合言葉」付きの関数経由のみ（テーブルへの直接アクセスは不可）。 */
  const SUPABASE_URL = "https://rbmeapmglmjnypfgrrij.supabase.co";
  const SUPABASE_KEY = "sb_publishable_7mCo7VvdkvGYO62n2jLykw_O9qpiuPy";
  const LS_KEY = "taxi.key", LS_DEV = "taxi.device";
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  };
  const newId = () => {
    try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (_) {}
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  };

  // 合言葉：URLの #以降 → 端末に保存。ホーム画面に追加しても残るよう、URLにも付け直す
  function readKey() {
    const h = decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
    if (/^[A-Za-z0-9_-]{8,64}$/.test(h)) { ls.set(LS_KEY, h); return h; }
    const saved = ls.get(LS_KEY);
    if (saved) { try { history.replaceState(null, "", "#" + saved); } catch (_) {} return saved; }
    return null;
  }

  function apiError(error) {
    const e = new Error((error && error.message) || "error");
    e.code = error && (error.code === "42501" || /forbidden/i.test(error.message || "")) ? "invalid_argument" : "network";
    return e;
  }

  (async () => {
    const KEY = readKey();
    if (!window.supabase || !window.supabase.createClient || SUPABASE_URL.startsWith("__")) {
      setSync("error"); state.loaded = true; render();
      toast("共有データベースを読み込めません。電波の良い場所で開き直してください", { error: true, ms: 8000 }); return;
    }
    if (!KEY) {
      setSync("error"); state.loaded = true; render();
      toast("共有用のURL（#から始まる合言葉付き）から開いてください", { error: true, ms: 10000 }); return;
    }
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    myId = ls.get(LS_DEV) || (() => { const v = "dev_" + newId(); ls.set(LS_DEV, v); return v; })();

    let channel = null, chReady = false;
    const notify = () => { if (channel && chReady) channel.send({ type: "broadcast", event: "changed", payload: {} }).catch(() => {}); };

    // 既存コードの db.collection("rides").doc().set/delete と同じ形で使えるようにする
    db = {
      collection() {
        return {
          doc(id) {
            id = id || newId();
            return {
              id,
              async set(b) {
                const { error } = await sb.rpc("taxi_add", {
                  p_key: KEY, p_id: id, p_label: b.label, p_amount: b.amount,
                  p_recorded_at: b.recordedAt, p_recorded_by: b.recordedBy, p_created_at: b.createdAt,
                });
                if (error) throw apiError(error);
                notify(); refresh();
              },
              async delete() {
                const { error } = await sb.rpc("taxi_delete", { p_key: KEY, p_id: id });
                if (error) throw apiError(error);
                notify(); refresh();
              },
            };
          },
        };
      },
    };
    render();

    let seq = 0, okOnce = false, failShown = false;
    async function refresh() {
      const my = ++seq;
      const { data, error } = await sb.rpc("taxi_list", { p_key: KEY, p_from: windowStart() });
      if (my !== seq) return;
      if (error) {
        setSync(navigator.onLine === false ? "offline" : "error");
        if (!state.loaded) { state.loaded = true; render(); }
        if (!failShown) {
          failShown = true;
          const forbidden = apiError(error).code === "invalid_argument";
          toast(forbidden ? "合言葉が正しくありません。共有用のURLから開き直してください" :
                okOnce ? "表示中のデータが最新でない可能性があります" : "データに接続できません。電波の良い場所でお試しください",
                { error: true, ms: 6000 });
          if (forbidden) { state.canWrite = false; applyWriteState(); }
        }
        return;
      }
      failShown = false; okOnce = true;
      state.rides = (data || []).map(x => ({
        id: String(x.id),
        label: typeof x.label === "string" ? x.label : "その他",
        amount: Number.isFinite(Number(x.amount)) ? Number(x.amount) : 0,
        recordedAt: Number(x.recorded_at) || 0,
        recordedBy: typeof x.recorded_by === "string" ? x.recorded_by : null,
        createdAt: Number(x.created_at) || 0,
        pending: false,
      }));
      for (const r of state.rides) ghosts.delete(r.id);
      state.loaded = true;
      setSync("live");
      render();
    }

    const timer = setTimeout(() => {
      if (!state.loaded) { setSync("error"); state.loaded = true; render(); toast("データに接続できません。電波の良い場所でお試しください", { error: true, ms: 6000 }); }
    }, 10000);
    await refresh();
    clearTimeout(timer);

    // 相手の変更をすぐ受け取る（合言葉から作った名前のチャンネル）
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("taxi:" + KEY));
      const name = "taxi-" + [...new Uint8Array(buf)].slice(0, 12).map(b => b.toString(16).padStart(2, "0")).join("");
      channel = sb.channel(name, { config: { broadcast: { self: false } } })
        .on("broadcast", { event: "changed" }, () => refresh())
        .subscribe((st) => { chReady = st === "SUBSCRIBED"; if (chReady) refresh(); });
    } catch (_) {}

    // 念のための定期更新と、アプリに戻ってきたときの更新
    setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 30000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
    window.addEventListener("offline", () => setSync("offline"));
    window.addEventListener("online", () => refresh());
  })();

  // 月が変わったらセグメントを更新
  setInterval(() => { const m = months()[0]; if (!renderSeg._m || renderSeg._m !== m.y * 100 + m.m) { renderSeg._m = m.y * 100 + m.m; render(); } }, 60000);
})();
</script>
</body>
</html>
