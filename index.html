<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerva Lab</title>
<meta name="description" content="Minerva Lab — 準備中">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #0f1724;
    color: #e8e6e1;
    padding: 24px;
  }
  .wrap { text-align: center; max-width: 480px; }
  .mark {
    width: 64px; height: 64px;
    margin: 0 auto 24px;
    border: 2px solid #c9a96e;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    color: #c9a96e;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: normal;
    font-size: 40px;
    letter-spacing: 0.06em;
    margin: 0 0 12px;
  }
  .sub {
    font-size: 14px;
    letter-spacing: 0.2em;
    color: #c9a96e;
    margin: 0 0 32px;
  }
  p { font-size: 15px; line-height: 1.8; color: #a9b0bb; margin: 0; }
  footer { margin-top: 48px; font-size: 12px; color: #5d6673; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">M</div>
    <h1>Minerva Lab</h1>
    <div class="sub">COMING SOON</div>
    <p>ただいまサイトを準備中です。<br>もうしばらくお待ちください。</p>
    <footer>&copy; 2026 Minerva Lab</footer>
  </div>
</body>
</html>
