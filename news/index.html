<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AIニュース">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>AIニュース</title>
<style>
/* iOS-native look: grouped background, widget-style rounded tiles, 2x2 matrix, bottom sheet for terms */
:root{
  --bg:#f2f2f7; --card:#ffffff; --ink:#000000; --ink2:rgba(60,60,67,.62); --ink3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --link:#007aff; --dim:rgba(0,0,0,.32);
  --c-claude:#e8743b; --c-gpt:#10a37f; --c-gem:#3478f6; --c-manus:#8e8e93; --c-other:#af52de;
  --t-mean:#007aff; --t-mean-bg:rgba(0,122,255,.09);
  --t-anal:#ff9500; --t-anal-bg:rgba(255,149,0,.11);
  --t-ctx:#34c759; --t-ctx-bg:rgba(52,199,89,.11);
  --r-tile:22px; --r-card:16px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --ink2:rgba(235,235,245,.62); --ink3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --link:#0a84ff; --dim:rgba(0,0,0,.55);
  --c-claude:#ff8a50; --c-gpt:#30d158; --c-gem:#5e9bff; --c-manus:#98989d; --c-other:#bf5af2;
  --t-mean:#0a84ff; --t-mean-bg:rgba(10,132,255,.16);
  --t-anal:#ff9f0a; --t-anal-bg:rgba(255,159,10,.16);
  --t-ctx:#30d158; --t-ctx-bg:rgba(48,209,88,.15);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:34rem;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Large title */
.eyebrow{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.02em;text-transform:uppercase}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:2px 0 4px}
.sub{font-size:13px;color:var(--ink2);margin:0 0 18px}

/* Highlight widget */
.widget{background:var(--card);border-radius:var(--r-tile);padding:16px 18px 14px;margin-bottom:12px}
.wlabel{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.wlabel .dot{width:8px;height:8px;border-radius:50%;background:#ff3b30}
.hl{list-style:none;margin:0;padding:0}
.hl li{position:relative;padding:8px 0 8px 14px;font-size:15px;line-height:1.5;font-weight:500}
.hl li+li{border-top:.5px solid var(--sep)}
.hl li::before{content:"";position:absolute;left:0;top:16px;width:6px;height:6px;border-radius:50%;background:var(--accent,var(--ink3))}

/* 2x2 matrix */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.tile{all:unset;display:flex;flex-direction:column;justify-content:space-between;min-height:132px;padding:14px;border-radius:var(--r-tile);cursor:pointer;
  background:var(--card);position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.tile::before{content:"";position:absolute;inset:0;background:var(--tc);opacity:.10;pointer-events:none}
.tile .top{display:flex;align-items:center;justify-content:space-between;position:relative}
.tile .name{font-size:15px;font-weight:700;color:var(--tc)}
.tile .count{font-size:12px;font-weight:700;color:#fff;background:var(--tc);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.tile .count.zero{background:var(--fill);color:var(--ink2)}
.tile .head{position:relative;font-size:14px;font-weight:600;line-height:1.4;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .head.muted{color:var(--ink2);font-weight:500}
.tile .co{position:relative;font-size:11px;color:var(--ink2);margin-top:6px}

/* Sections: inset grouped lists */
section{margin-top:26px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 12px)}
.sh{display:flex;align-items:baseline;gap:8px;padding:0 4px 7px}
.sh h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sh .bar{width:4px;height:18px;border-radius:2px;background:var(--sc);align-self:center}
.sh small{font-size:13px;color:var(--ink2)}
.group{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.row{padding:13px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .ttl{font-size:16px;font-weight:700;margin:0 0 3px;line-height:1.4}
.row .body{font-size:15px;line-height:1.65;margin:0;color:var(--ink)}
.row.none .body{color:var(--ink2)}
.src{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:13px;color:var(--link);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src::after{content:"↗";font-size:12px}

/* Tappable terms */
.t{all:unset;cursor:pointer;color:var(--sc,var(--link));font-weight:600;text-decoration:underline dotted 1.5px;text-underline-offset:4px;border-radius:4px;-webkit-tap-highlight-color:transparent}
.t:active,.t[aria-expanded="true"]{background:var(--fill)}
.t:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* Glossary (collapsed) */
details.gl{margin-top:30px;background:var(--card);border-radius:var(--r-card);overflow:hidden}
details.gl>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:16px;font-weight:600}
details.gl>summary::-webkit-details-marker{display:none}
details.gl>summary .ic{width:30px;height:30px;border-radius:8px;background:var(--t-anal);display:grid;place-items:center;font-size:16px}
details.gl>summary .chev{margin-left:auto;color:var(--ink3);font-size:18px;transition:transform .2s}
details.gl[open]>summary .chev{transform:rotate(90deg)}
.ggh{font-size:13px;color:var(--ink2);padding:14px 16px 6px;border-top:.5px solid var(--sep);margin:0}
.gitem{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;padding:11px 16px;cursor:pointer;font-size:16px;position:relative;-webkit-tap-highlight-color:transparent}
.gitem+.gitem::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.gitem:active{background:var(--fill)}
.gitem:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.gitem .chev{margin-left:auto;color:var(--ink3)}

/* Sources */
.sources{margin-top:26px}
.sources .lab{font-size:13px;color:var(--ink2);padding:0 4px 7px;text-transform:uppercase;letter-spacing:.02em}
.sources a{display:block;padding:11px 16px;font-size:13px;color:var(--link);text-decoration:none;word-break:break-all;position:relative}
.sources a+a::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.foot{font-size:12px;color:var(--ink3);text-align:center;margin-top:20px}

/* Bottom sheet */
.dim{position:fixed;inset:0;background:var(--dim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:34rem;max-height:78vh;display:flex;flex-direction:column;
  background:var(--bg);border-radius:14px 14px 0 0;z-index:21;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--ink3);margin:8px auto 2px;flex:none}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex:none}
.sheet .hd h3{margin:0;font-size:20px;font-weight:700;line-height:1.3;flex:1}
.sheet .x{all:unset;width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:15px;color:var(--ink2);cursor:pointer;flex:none}
.sheet .x:focus-visible{outline:2px solid var(--link)}
.sheet .sc{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px;overscroll-behavior:contain}
.blk{background:var(--card);border-radius:var(--r-card);padding:13px 15px;margin-top:10px}
.blk .lab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:7px}
.blk p{margin:0;font-size:16px;line-height:1.75}
.mean .lab{color:var(--t-mean);background:var(--t-mean-bg)}
.anal .lab{color:var(--t-anal);background:var(--t-anal-bg)}
.ctx .lab{color:var(--t-ctx);background:var(--t-ctx-bg)}
.mean p{font-weight:600}
#defs{display:none}
@media (prefers-reduced-motion:reduce){.sheet,.dim,.tile{transition:none}}
/* --- app additions: day strip, back numbers, states --- */
.days{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px 16px;padding:2px 16px 4px;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.day{all:unset;flex:none;scroll-snap-align:start;min-width:48px;padding:7px 8px 6px;border-radius:14px;background:var(--card);text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.day .w{display:block;font-size:11px;font-weight:600;color:var(--ink2)}
.day .n{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.day .pip{display:block;width:5px;height:5px;border-radius:50%;margin:3px auto 0;background:var(--link)}
.day .pip.off{background:transparent}
.day[aria-current="true"]{background:var(--ink);color:var(--bg)}
.day[aria-current="true"] .w{color:var(--bg);opacity:.75}
.day[aria-current="true"] .pip{background:var(--bg)}
.day:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.unc{margin-top:26px}
.unc .row .body{color:var(--ink2);font-size:14px}
.pager{display:flex;gap:12px;margin-top:22px}
.pager button{all:unset;flex:1;text-align:center;padding:12px;border-radius:var(--r-card);background:var(--card);font-size:15px;font-weight:600;color:var(--link);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pager button[disabled]{color:var(--ink3);cursor:default}
.pager button:not([disabled]):active{background:var(--fill)}
.pager button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
details.back>summary .ic{background:var(--link)}
.bitem{all:unset;box-sizing:border-box;width:100%;display:flex;gap:12px;align-items:center;padding:11px 16px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.bitem+.bitem::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.bitem:active{background:var(--fill)}
.bitem:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.bitem .d{flex:none;width:64px;font-size:14px;font-weight:700}
.bitem .d small{display:block;font-size:11px;font-weight:500;color:var(--ink2)}
.bitem .tx{flex:1;min-width:0;font-size:14px;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bitem .tx.muted{color:var(--ink2)}
.bitem .chev{flex:none;color:var(--ink3)}
.state{background:var(--card);border-radius:var(--r-tile);padding:28px 20px;text-align:center;color:var(--ink2);font-size:15px}
.state button{all:unset;display:inline-block;margin-top:12px;color:var(--link);font-weight:600;cursor:pointer}
.skel{height:14px;border-radius:7px;background:var(--fill);margin:10px auto;width:70%}
#view{min-height:40vh}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow">&nbsp;</div>
  <h1 id="h1">AIニュース</h1>
  <p class="sub" id="sub">&nbsp;</p>
  <nav class="days" id="days" aria-label="日付をえらぶ"></nav>
  <div id="view"><div class="state"><div class="skel"></div><div class="skel" style="width:50%"></div></div></div>
  <div class="pager" id="pager" hidden>
    <button id="prev">‹ 前の日</button>
    <button id="next">次の日 ›</button>
  </div>
  <details class="gl back" id="back" hidden>
    <summary><span class="ic">🗓</span>バックナンバー<span class="chev">›</span></summary>
    <div id="backlist"></div>
  </details>
  <p class="foot">色つきの点線の言葉をタップすると解説が開きます</p>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" aria-hidden="true">
  <div class="grab"></div>
  <div class="hd"><h3 id="sh-t"></h3><button class="x" id="sh-x" aria-label="閉じる">✕</button></div>
  <div class="sc" id="sh-c"></div>
</div>

<script>
(function(){
  var SVC=[
    {id:'claude',name:'Claude',co:'Anthropic'},
    {id:'gpt',name:'ChatGPT',co:'OpenAI'},
    {id:'gem',name:'Gemini',co:'Google / DeepMind'},
    {id:'manus',name:'Manus',co:'Manus'}
  ];
  var COLOR={claude:'--c-claude',gpt:'--c-gpt',gem:'--c-gem',manus:'--c-manus',other:'--c-other'};
  var WD=['日','月','火','水','木','金','土'];
  var $=function(id){return document.getElementById(id);};
  var index=[], cache={}, cur=null, terms={};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  // "[[key|表示]]" -> tappable term
  function rich(s){
    return esc(s).replace(/\[\[([A-Za-z0-9_-]+)\|([^\]]+?)\]\]/g,function(_,k,l){
      return terms[k]?'<button class="t" data-k="'+k+'">'+l+'</button>':l;
    });
  }
  function parts(date){var p=date.split('-').map(Number);var d=new Date(Date.UTC(p[0],p[1]-1,p[2]));return {m:p[1],d:p[2],w:WD[d.getUTCDay()]};}
  function jstToday(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10);}
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
  function count(day,id){var s=(day.services||{})[id];return s&&s.items?s.items.length:0;}

  function load(url){
    return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});
  }

  function renderStrip(){
    $('days').innerHTML=index.map(function(e){
      var p=parts(e.date);
      return '<button class="day" data-d="'+e.date+'" aria-label="'+p.m+'月'+p.d+'日"><span class="w">'+p.w+'</span><span class="n">'+p.d+'</span><span class="pip'+(e.total>0?'':' off')+'"></span></button>';
    }).join('');
    $('backlist').innerHTML=index.map(function(e){
      var p=parts(e.date);
      return '<button class="bitem" data-d="'+e.date+'"><span class="d">'+p.m+'/'+p.d+'<small>'+p.w+'曜日・'+e.total+'件</small></span><span class="tx'+(e.total>0?'':' muted')+'">'+esc(e.highlight||'新しい公式発表なし')+'</span><span class="chev">›</span></button>';
    }).join('');
    $('back').hidden=index.length<2;
  }

  function renderDay(day){
    terms=day.terms||{};
    var p=parts(day.date), isToday=day.date===jstToday();
    $('eyebrow').textContent=p.m+'月'+p.d+'日 '+p.w+'曜日';
    $('h1').textContent=isToday?'今日のAIニュース':p.m+'月'+p.d+'日のAIニュース';
    $('sub').textContent=day.period||'';
    document.title='AIニュース '+day.date;
    var h='';
    var hl=day.highlights||[];
    if(hl.length){
      h+='<div class="widget"><div class="wlabel"><span class="dot"></span>ハイライト</div><ul class="hl">'+
        hl.map(function(x){return '<li'+(COLOR[x.svc]?' style="--accent:var('+COLOR[x.svc]+')"':'')+'>'+esc(x.text)+'</li>';}).join('')+'</ul></div>';
    }
    h+='<div class="matrix">'+SVC.map(function(s){
      var n=count(day,s.id), sv=(day.services||{})[s.id]||{};
      return '<button class="tile" style="--tc:var('+COLOR[s.id]+')" data-go="s-'+s.id+'"><div class="top"><span class="name">'+s.name+'</span><span class="count'+(n?'':' zero')+'">'+n+'件</span></div>'+
        '<div class="head'+(n?'':' muted')+'">'+esc(n?(sv.head||''):'新しい公式発表なし')+'</div><div class="co">'+s.co+'</div></button>';
    }).join('')+'</div>';
    var all=SVC.concat([{id:'other',name:'その他',co:''}]);
    all.forEach(function(s){
      var sv=(day.services||{})[s.id];
      if(s.id==='other'&&(!sv||!(sv.items||[]).length)&&!(sv&&sv.none))return;
      sv=sv||{};
      var items=sv.items||[];
      h+='<section id="s-'+s.id+'" style="--sc:var('+COLOR[s.id]+')"><div class="sh"><span class="bar"></span><h2>'+s.name+'</h2>'+(s.co&&s.co!==s.name?'<small>'+s.co+'</small>':'')+'</div><div class="group">';
      items.forEach(function(it){
        h+='<div class="row">'+(it.title?'<p class="ttl">'+rich(it.title)+'</p>':'')+'<p class="body">'+rich(it.body)+'</p>'+
          (it.url?'<a class="src" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(host(it.url))+'</a>':'')+'</div>';
      });
      if(!items.length||sv.none){
        h+='<div class="row none"><p class="body">'+rich(sv.none||'新しい公式発表なし')+'</p></div>';
      }
      h+='</div></section>';
    });
    var unc=day.unconfirmed||[];
    if(unc.length){
      h+='<section class="unc" style="--sc:var(--ink3)"><div class="sh"><span class="bar"></span><h2>未確認</h2><small>公式発表なし</small></div><div class="group">'+
        unc.map(function(u){return '<div class="row"><p class="body">'+rich(u.text)+'</p>'+(u.url?'<a class="src" href="'+esc(u.url)+'" target="_blank" rel="noopener">'+esc(host(u.url))+'</a>':'')+'</div>';}).join('')+'</div></section>';
    }
    var gl=day.glossary||[];
    if(gl.length){
      h+='<details class="gl" id="gl"><summary><span class="ic">📖</span>今日の用語<span class="chev">›</span></summary>';
      gl.forEach(function(g){
        if(g.group)h+='<p class="ggh">'+esc(g.group)+'</p>';
        (g.keys||[]).forEach(function(k){if(terms[k])h+='<button class="gitem" data-k="'+k+'">'+esc(terms[k].name)+'<span class="chev">›</span></button>';});
      });
      h+='</details>';
    }
    var src=day.sources||[];
    if(src.length){
      h+='<div class="sources"><div class="lab">Sources</div><div class="group">'+src.map(function(u){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>';}).join('')+'</div></div>';
    }
    $('view').innerHTML=h;
  }

  function show(date,scroll){
    cur=date;
    document.querySelectorAll('.day').forEach(function(b){b.setAttribute('aria-current',b.dataset.d===date?'true':'false');});
    var btn=document.querySelector('.day[data-d="'+date+'"]');
    if(btn&&btn.scrollIntoView)btn.scrollIntoView({block:'nearest',inline:'nearest'});
    var i=index.findIndex(function(e){return e.date===date;});
    $('pager').hidden=index.length<2;
    $('prev').disabled=i<0||i>=index.length-1;
    $('next').disabled=i<=0;
    var go=function(day){if(cur!==date)return;renderDay(day);if(scroll)window.scrollTo({top:0});};
    if(cache[date]){go(cache[date]);return;}
    load('data/days/'+date+'.json').then(function(d){cache[date]=d;go(d);}).catch(function(){
      if(cur!==date)return;
      $('view').innerHTML='<div class="state">この日のニュースを読み込めませんでした。<br><button id="retry">もう一度読み込む</button></div>';
      $('retry').onclick=function(){show(date);};
    });
  }

  function route(scroll){
    var m=/^#d-(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
    var date=m&&index.some(function(e){return e.date===m[1];})?m[1]:(index[0]&&index[0].date);
    if(date)show(date,scroll);
  }
  function pick(date){
    if(location.hash==='#d-'+date){route(true);return;}
    location.hash='d-'+date;
  }

  // clicks: days, back numbers, pager, tiles, terms
  document.addEventListener('click',function(e){
    var b=e.target.closest('.day,.bitem');
    if(b){$('back').open=false;pick(b.dataset.d);return;}
    var t=e.target.closest('.tile');
    if(t){var s=document.getElementById(t.dataset.go);if(s)s.scrollIntoView({behavior:'smooth',block:'start'});return;}
    var k=e.target.closest('.t,.gitem');
    if(k){e.stopPropagation();if(opener===k&&sheet.classList.contains('on')){close();return;}open(k.dataset.k,k);}
  });
  $('prev').onclick=function(){var i=index.findIndex(function(e){return e.date===cur;});if(index[i+1])pick(index[i+1].date);};
  $('next').onclick=function(){var i=index.findIndex(function(e){return e.date===cur;});if(i>0)pick(index[i-1].date);};
  window.addEventListener('hashchange',function(){route(true);});

  // bottom sheet (same behaviour as the original daily page)
  var sheet=$('sheet'), dim=$('dim'), tEl=$('sh-t'), cEl=$('sh-c'), xBtn=$('sh-x'), opener=null;
  function open(k,btn){
    var d=terms[k]; if(!d) return;
    if(opener) opener.setAttribute('aria-expanded','false');
    opener=btn; btn.setAttribute('aria-expanded','true');
    tEl.textContent=d.name;
    cEl.innerHTML='<div class="blk mean"><span class="lab">💡 意味</span><p>'+esc(d.mean)+'</p></div>'+
      '<div class="blk anal"><span class="lab">🗒 たとえるなら</span><p>'+esc(d.analogy)+'</p></div>'+
      '<div class="blk ctx"><span class="lab">📰 このニュースでは</span><p>'+esc(d.context)+'</p></div>';
    cEl.scrollTop=0;
    sheet.style.transform='';
    sheet.classList.add('on'); dim.classList.add('on'); sheet.setAttribute('aria-hidden','false');
    setTimeout(function(){xBtn.focus({preventScroll:true});},50);
  }
  function close(){
    if(!sheet.classList.contains('on')) return;
    sheet.classList.remove('on'); dim.classList.remove('on'); sheet.setAttribute('aria-hidden','true');
    sheet.style.transform='';
    if(opener){opener.setAttribute('aria-expanded','false'); try{opener.focus({preventScroll:true});}catch(e){} opener=null;}
  }
  dim.addEventListener('click',close);
  xBtn.addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  var y0=null, dy=0;
  sheet.addEventListener('touchstart',function(e){
    var inHead=!cEl.contains(e.target);
    if(inHead||cEl.scrollTop<=0){y0=e.touches[0].clientY;dy=0;sheet.style.transition='none';}
  },{passive:true});
  sheet.addEventListener('touchmove',function(e){
    if(y0===null) return; dy=e.touches[0].clientY-y0;
    sheet.style.transform=dy>0?'translateY('+dy+'px)':'';
  },{passive:true});
  sheet.addEventListener('touchend',function(){
    if(y0===null) return; sheet.style.transition='';
    if(dy>90) close(); else sheet.style.transform='';
    y0=null; dy=0;
  });

  load('data/index.json').then(function(j){
    index=(j.days||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
    if(!index.length){$('view').innerHTML='<div class="state">まだニュースがありません。</div>';return;}
    renderStrip(); route(false);
  }).catch(function(){
    $('view').innerHTML='<div class="state">ニュースの一覧を読み込めませんでした。<br><button id="reload">再読み込み</button></div>';
    $('reload').onclick=function(){location.reload();};
  });
})();
</script>
</body>
</html>
