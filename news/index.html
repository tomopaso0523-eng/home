<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AIニュース">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171613" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<title>AIニュース</title>
<style>
/* Style: Refero "Perplexity AI — scholar's parchment" tokens (warm paper, one teal accent, flat, 400/500 weights),
   motion & materials per Apple fluid-interface principles. */
:root{
  --color-parchment:#faf8f5; --color-soft-paper:#fdfbfa; --color-warm-mist:#d1d1cd;
  --color-ash:#92918b; --color-graphite:#72706b; --color-ink:#27251e; --color-deep-teal:#016a71; --color-on-teal:#ffffff;
  --fill:rgba(39,37,30,.06); --scrim:rgba(39,37,30,.28); --chrome:rgba(250,248,245,.82);
  --shadow-subtle:rgba(0,0,0,.08) 0 1px 2px 0;
  --c-claude:#e8743b; --c-gpt:#10a37f; --c-gem:#3478f6; --c-manus:#8e8e93; --c-other:#af52de;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --text-caption:11px; --text-body-sm:12px; --text-body:14px; --text-body-lg:16px;
  --w-regular:400; --w-medium:500;
  --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s32:32px;
  --radius-cards:16px; --radius-inputs:12px; --radius-buttons:6px; --radius-chips:9999px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --color-parchment:#171613; --color-soft-paper:#201f1b; --color-warm-mist:#3a3832;
  --color-ash:#8a8881; --color-graphite:#aeaca5; --color-ink:#efede7; --color-deep-teal:#0f7f87; --color-on-teal:#ffffff;
  --fill:rgba(239,237,231,.08); --scrim:rgba(0,0,0,.5); --chrome:rgba(23,22,19,.8);
  --shadow-subtle:rgba(0,0,0,.4) 0 1px 2px 0;
  --c-claude:#f08a55; --c-gpt:#2fbf94; --c-gem:#5e9bff; --c-manus:#a1a1a6; --c-other:#c27ef0;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--color-parchment);color:var(--color-ink);font-family:var(--font);font-size:var(--text-body-lg);line-height:1.7;font-weight:var(--w-regular);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:36rem;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + var(--s16));
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px);
  padding-left:max(var(--s16),env(safe-area-inset-left,0px));
  padding-right:max(var(--s16),env(safe-area-inset-right,0px))}

/* Header */
.eyebrow{font-size:var(--text-body-sm);font-weight:var(--w-medium);color:var(--color-graphite);letter-spacing:.02em}
h1{font-size:30px;font-weight:var(--w-medium);letter-spacing:-.02em;line-height:1.2;margin:var(--s4) 0}
.sub{font-size:var(--text-body-sm);color:var(--color-ash);margin:0}

/* Day strip: translucent sticky chrome, content scrolls under it */
.bar-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:var(--s12) calc(-1 * max(var(--s16),env(safe-area-inset-left,0px))) var(--s16);
  background:var(--chrome);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.bar-wrap::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;pointer-events:none;
  background:linear-gradient(var(--chrome),transparent);opacity:0;transition:opacity .2s}
.bar-wrap.stuck::after{opacity:1}
.days{display:flex;gap:var(--s8);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:var(--s8) max(var(--s16),env(safe-area-inset-left,0px));scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.day{all:unset;flex:none;scroll-snap-align:start;width:44px;padding:var(--s8) 0;border-radius:var(--radius-chips);text-align:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;border:1px solid var(--color-warm-mist);background:var(--color-soft-paper);transition:transform .1s ease-out}
.day:active{transform:scale(.94)}
.day .w{display:block;font-size:var(--text-caption);color:var(--color-graphite);line-height:1.4}
.day .n{display:block;font-size:var(--text-body-lg);font-weight:var(--w-medium);font-variant-numeric:tabular-nums;line-height:1.3}
.day .pip{display:block;width:4px;height:4px;border-radius:50%;margin:3px auto 0;background:var(--color-ink)}
.day .pip.off{background:transparent}
.day[aria-current="true"]{background:var(--color-deep-teal);border-color:var(--color-deep-teal);color:var(--color-on-teal)}
.day[aria-current="true"] .w{color:var(--color-on-teal);opacity:.8}
.day[aria-current="true"] .pip{background:var(--color-on-teal)}
.day:focus-visible{outline:2px solid var(--color-deep-teal);outline-offset:2px}

/* Cards */
.card{background:var(--color-soft-paper);border:1px solid var(--color-warm-mist);border-radius:var(--radius-cards)}
.label{font-size:var(--text-body-sm);font-weight:var(--w-medium);color:var(--color-graphite);letter-spacing:.02em}

.widget{padding:var(--s16);margin-bottom:var(--s12)}
.hl{list-style:none;margin:var(--s8) 0 0;padding:0}
.hl li{position:relative;padding:var(--s8) 0 var(--s8) var(--s16);font-size:var(--text-body-lg);line-height:1.65}
.hl li+li{border-top:1px solid var(--color-warm-mist)}
.hl li::before{content:"";position:absolute;left:0;top:19px;width:6px;height:6px;border-radius:50%;background:var(--accent,var(--color-ash))}

/* 2x2 service tiles */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:var(--s8)}
.tile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:var(--s8);min-height:112px;background:var(--color-soft-paper);border:1px solid var(--color-warm-mist);border-radius:var(--radius-cards);padding:var(--s12) var(--s16) var(--s16);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .1s ease-out,background-color .1s}
.tile:active{transform:scale(.97);background:var(--fill)}
.tile:focus-visible{outline:2px solid var(--color-deep-teal);outline-offset:2px}
.tile .top{display:flex;align-items:center;gap:var(--s8)}
.tile .mark{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
.tile .name{font-size:var(--text-body);font-weight:var(--w-medium)}
.tile .count{margin-left:auto;font-size:var(--text-body-sm);color:var(--color-graphite);font-variant-numeric:tabular-nums}
.tile .count.zero{color:var(--color-ash)}
.tile .head{font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .head.muted{color:var(--color-ash)}

/* Sections */
section{margin-top:var(--s32);scroll-margin-top:96px}
.sh{display:flex;align-items:center;gap:var(--s8);padding:0 var(--s4) var(--s8)}
.sh .mark{width:8px;height:8px;border-radius:50%;background:var(--sc)}
.sh h2{margin:0;font-size:20px;font-weight:var(--w-medium);letter-spacing:-.01em;line-height:1.3}
.sh small{font-size:var(--text-body-sm);color:var(--color-ash);margin-left:auto}
.group{overflow:hidden}
.row{padding:var(--s16);position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:var(--s16);right:0;border-top:1px solid var(--color-warm-mist)}
.row .ttl{font-size:var(--text-body-lg);font-weight:var(--w-medium);margin:0 0 var(--s4);line-height:1.5}
.row .body{font-size:var(--text-body-lg);line-height:1.75;margin:0}
.row.none .body{color:var(--color-graphite);font-size:15px}
.src{display:inline-block;margin-top:var(--s8);font-size:13px;color:var(--color-graphite);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.src::after{content:" ↗"}
.src:active{color:var(--color-ink)}

/* Tappable terms: ink text, service-coloured dotted underline */
.t{all:unset;cursor:pointer;font-weight:var(--w-medium);text-decoration:underline dotted 2px;text-decoration-color:var(--sc,var(--color-deep-teal));text-underline-offset:5px;border-radius:4px;-webkit-tap-highlight-color:transparent}
.t:active,.t[aria-expanded="true"]{background:var(--fill)}
.t:focus-visible{outline:2px solid var(--color-deep-teal);outline-offset:2px}

/* Disclosure lists (glossary / back numbers) */
details.list{margin-top:var(--s32);overflow:hidden}
details.list+details.list{margin-top:var(--s12)}
details.list>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:var(--s8);padding:var(--s16);font-size:var(--text-body-lg);font-weight:var(--w-medium);-webkit-tap-highlight-color:transparent}
details.list>summary::-webkit-details-marker{display:none}
details.list>summary small{font-size:var(--text-body-sm);font-weight:var(--w-regular);color:var(--color-ash)}
details.list>summary .chev{margin-left:auto;color:var(--color-ash);transition:transform .2s ease-out}
details.list[open]>summary .chev{transform:rotate(90deg)}
details.list>summary:focus-visible{outline:2px solid var(--color-deep-teal);outline-offset:-2px}
.ggh{font-size:var(--text-body-sm);color:var(--color-graphite);padding:var(--s12) var(--s16) var(--s4);border-top:1px solid var(--color-warm-mist);margin:0}
.gitem,.bitem{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:var(--s12);padding:var(--s12) var(--s16);cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.gitem{font-size:var(--text-body-lg)}
.gitem+.gitem::before,.bitem+.bitem::before{content:"";position:absolute;top:0;left:var(--s16);right:0;border-top:1px solid var(--color-warm-mist)}
.bitem:first-of-type{border-top:1px solid var(--color-warm-mist)}
.gitem:active,.bitem:active{background:var(--fill)}
.gitem:focus-visible,.bitem:focus-visible{outline:2px solid var(--color-deep-teal);outline-offset:-2px}
.gitem .chev,.bitem .chev{margin-left:auto;color:var(--color-ash);flex:none}
.bitem .d{flex:none;width:60px;font-size:var(--text-body);font-weight:var(--w-medium);font-variant-numeric:tabular-nums;line-height:1.4}
.bitem .d small{display:block;font-size:var(--text-caption);font-weight:var(--w-regular);color:var(--color-ash)}
.bitem .tx{flex:1;min-width:0;font-size:var(--text-body);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bitem .tx.muted{color:var(--color-ash)}

/* Sources */
.sources{margin-top:var(--s32)}
.sources .label{padding:0 var(--s4) var(--s8)}
.sources a{display:block;padding:var(--s12) var(--s16);font-size:13px;line-height:1.5;color:var(--color-graphite);text-decoration:none;word-break:break-all;position:relative}
.sources a+a::before{content:"";position:absolute;top:0;left:var(--s16);right:0;border-top:1px solid var(--color-warm-mist)}
.sources a:active{background:var(--fill)}

/* Pager */
.pager{display:flex;gap:var(--s8);margin-top:var(--s32)}
.pager button{all:unset;flex:1;text-align:center;padding:var(--s12);border-radius:var(--radius-inputs);border:1px solid var(--color-warm-mist);font-size:var(--text-body);color:var(--color-ink);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s ease-out}
.pager button[disabled]{color:var(--color-ash);cursor:default;opacity:.6}
.pager button:not([disabled]):active{transform:scale(.97);background:var(--fill)}
.pager button:focus-visible{outline:2px solid var(--color-deep-teal);outline-offset:2px}
.foot{font-size:var(--text-body-sm);color:var(--color-ash);text-align:center;margin-top:var(--s32)}

/* States */
.state{padding:var(--s32) var(--s16);text-align:center;color:var(--color-graphite);font-size:15px}
.state button{all:unset;display:inline-block;margin-top:var(--s12);padding:var(--s8) var(--s12);border-radius:var(--radius-buttons);border:1px solid var(--color-warm-mist);cursor:pointer}
.skel{height:12px;border-radius:6px;background:var(--fill);margin:var(--s12) auto;width:70%}
#view{min-height:40vh}

/* Bottom sheet (spring-driven; JS sets transform) */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;z-index:20}
.scrim.on{pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:36rem;max-height:80vh;display:flex;flex-direction:column;
  background:var(--color-parchment);border-radius:var(--radius-cards) var(--radius-cards) 0 0;z-index:21;transform:translateY(110%);visibility:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -1px 0 var(--color-warm-mist);touch-action:none}
.sheet.on{visibility:visible}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--color-warm-mist);margin:var(--s8) auto var(--s4);flex:none}
.sheet .hd{display:flex;align-items:center;gap:var(--s12);padding:var(--s4) var(--s16) var(--s12);flex:none}
.sheet .hd h3{margin:0;font-size:20px;font-weight:var(--w-medium);line-height:1.35;flex:1}
.sheet .x{all:unset;width:32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:14px;color:var(--color-graphite);cursor:pointer;flex:none}
.sheet .x:focus-visible{outline:2px solid var(--color-deep-teal)}
.sheet .sc{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--s16) var(--s32);overscroll-behavior:contain;touch-action:pan-y}
.blk{padding:var(--s16);margin-top:var(--s8)}
.blk .label{display:block;margin-bottom:var(--s4)}
.blk p{margin:0;font-size:var(--text-body-lg);line-height:1.8}
.blk.mean p{font-size:17px;font-weight:var(--w-medium);line-height:1.65}
#sh-c .blk:first-child{margin-top:0}

@media (prefers-reduced-transparency:reduce){.bar-wrap{background:var(--color-parchment);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){.tile,.day,.pager button{transition:none}.tile:active,.day:active{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow">&nbsp;</div>
  <h1 id="h1">AIニュース</h1>
  <p class="sub" id="sub">&nbsp;</p>
  <div class="bar-wrap" id="barwrap"><nav class="days" id="days" aria-label="日付をえらぶ"></nav></div>
  <div id="view"><div class="card state"><div class="skel"></div><div class="skel" style="width:50%"></div></div></div>
  <div class="pager" id="pager" hidden>
    <button id="prev">‹ 前の日</button>
    <button id="next">次の日 ›</button>
  </div>
  <details class="card list" id="back" hidden>
    <summary>バックナンバー<small id="backcount"></small><span class="chev">›</span></summary>
    <div id="backlist"></div>
  </details>
  <p class="foot">点線の言葉をタップすると解説が開きます</p>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" aria-hidden="true">
  <div class="grab"></div>
  <div class="hd"><h3 id="sh-t"></h3><button class="x" id="sh-x" aria-label="閉じる">✕</button></div>
  <div class="sc" id="sh-c"></div>
</div>

<script>
(function(){
  var SVC=[
    {id:'claude',name:'Claude',co:'Anthropic'},
    {id:'gpt',name:'ChatGPT',co:'OpenAI'},
    {id:'gem',name:'Gemini',co:'Google / DeepMind'},
    {id:'manus',name:'Manus',co:''}
  ];
  var COLOR={claude:'--c-claude',gpt:'--c-gpt',gem:'--c-gem',manus:'--c-manus',other:'--c-other'};
  var WD=['日','月','火','水','木','金','土'];
  var $=function(id){return document.getElementById(id);};
  var index=[], cache={}, cur=null, terms={};
  var reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function rich(s){
    return esc(s).replace(/\[\[([A-Za-z0-9_-]+)\|([^\]]+?)\]\]/g,function(_,k,l){
      return terms[k]?'<button class="t" data-k="'+k+'">'+l+'</button>':l;
    });
  }
  function parts(date){var p=date.split('-').map(Number);var d=new Date(Date.UTC(p[0],p[1]-1,p[2]));return {m:p[1],d:p[2],w:WD[d.getUTCDay()]};}
  function jstToday(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10);}
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
  function count(day,id){var s=(day.services||{})[id];return s&&s.items?s.items.length:0;}
  function load(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}

  function renderStrip(){
    $('days').innerHTML=index.map(function(e){
      var p=parts(e.date);
      return '<button class="day" data-d="'+e.date+'" aria-label="'+p.m+'月'+p.d+'日 '+e.total+'件"><span class="w">'+p.w+'</span><span class="n">'+p.d+'</span><span class="pip'+(e.total>0?'':' off')+'"></span></button>';
    }).join('');
    $('backlist').innerHTML=index.map(function(e){
      var p=parts(e.date);
      return '<button class="bitem" data-d="'+e.date+'"><span class="d">'+p.m+'/'+p.d+'<small>'+p.w+'・'+e.total+'件</small></span><span class="tx'+(e.total>0?'':' muted')+'">'+esc(e.highlight||'新しい公式発表なし')+'</span><span class="chev">›</span></button>';
    }).join('');
    $('backcount').textContent=index.length+'日分';
    $('back').hidden=index.length<2;
  }

  function renderDay(day){
    terms=day.terms||{};
    var p=parts(day.date), isToday=day.date===jstToday();
    $('eyebrow').textContent=p.m+'月'+p.d+'日 '+p.w+'曜日';
    $('h1').textContent=isToday?'今日のAIニュース':p.m+'月'+p.d+'日のAIニュース';
    $('sub').textContent=day.period||'';
    document.title='AIニュース '+day.date;
    var h='';
    var hl=day.highlights||[];
    if(hl.length){
      h+='<div class="card widget"><div class="label">ハイライト</div><ul class="hl">'+
        hl.map(function(x){return '<li'+(COLOR[x.svc]?' style="--accent:var('+COLOR[x.svc]+')"':'')+'>'+esc(x.text)+'</li>';}).join('')+'</ul></div>';
    }
    h+='<div class="matrix">'+SVC.map(function(s){
      var n=count(day,s.id), sv=(day.services||{})[s.id]||{};
      return '<button class="card tile" style="--tc:var('+COLOR[s.id]+')" data-go="s-'+s.id+'"><div class="top"><span class="mark"></span><span class="name">'+s.name+'</span><span class="count'+(n?'':' zero')+'">'+n+'件</span></div>'+
        '<div class="head'+(n?'':' muted')+'">'+esc(n?(sv.head||''):'新しい公式発表なし')+'</div></button>';
    }).join('')+'</div>';
    SVC.concat([{id:'other',name:'その他',co:''}]).forEach(function(s){
      var sv=(day.services||{})[s.id];
      if(s.id==='other'&&(!sv||!(sv.items||[]).length)&&!(sv&&sv.none))return;
      sv=sv||{};
      var items=sv.items||[];
      h+='<section id="s-'+s.id+'" style="--sc:var('+COLOR[s.id]+')"><div class="sh"><span class="mark"></span><h2>'+s.name+'</h2>'+(s.co?'<small>'+s.co+'</small>':'')+'</div><div class="card group">';
      items.forEach(function(it){
        h+='<div class="row">'+(it.title?'<p class="ttl">'+rich(it.title)+'</p>':'')+'<p class="body">'+rich(it.body)+'</p>'+
          (it.url?'<a class="src" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(host(it.url))+'</a>':'')+'</div>';
      });
      if(!items.length||sv.none) h+='<div class="row none"><p class="body">'+rich(sv.none||'新しい公式発表なし')+'</p></div>';
      h+='</div></section>';
    });
    var unc=day.unconfirmed||[];
    if(unc.length){
      h+='<section style="--sc:var(--color-ash)"><div class="sh"><span class="mark"></span><h2>未確認</h2><small>公式発表なし</small></div><div class="card group">'+
        unc.map(function(u){return '<div class="row none"><p class="body">'+rich(u.text)+'</p>'+(u.url?'<a class="src" href="'+esc(u.url)+'" target="_blank" rel="noopener">'+esc(host(u.url))+'</a>':'')+'</div>';}).join('')+'</div></section>';
    }
    var gl=day.glossary||[], nterms=Object.keys(terms).length;
    if(gl.length&&nterms){
      h+='<details class="card list"><summary>今日の用語<small>'+nterms+'語</small><span class="chev">›</span></summary>';
      gl.forEach(function(g){
        if(g.group)h+='<p class="ggh">'+esc(g.group)+'</p>';
        (g.keys||[]).forEach(function(k){if(terms[k])h+='<button class="gitem" data-k="'+k+'">'+esc(terms[k].name)+'<span class="chev">›</span></button>';});
      });
      h+='</details>';
    }
    var src=day.sources||[];
    if(src.length){
      h+='<div class="sources"><div class="label">情報源（公式）</div><div class="card group">'+src.map(function(u){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>';}).join('')+'</div></div>';
    }
    $('view').innerHTML=h;
  }

  function show(date,scroll){
    cur=date;
    document.querySelectorAll('.day').forEach(function(b){b.setAttribute('aria-current',b.dataset.d===date?'true':'false');});
    var btn=document.querySelector('.day[data-d="'+date+'"]');
    if(btn){var st=$('days');st.scrollTo({left:btn.offsetLeft-st.clientWidth/2+btn.offsetWidth/2,behavior:reduceMotion?'auto':'smooth'});}
    var i=index.findIndex(function(e){return e.date===date;});
    $('pager').hidden=index.length<2;
    $('prev').disabled=i<0||i>=index.length-1;
    $('next').disabled=i<=0;
    var go=function(day){if(cur!==date)return;renderDay(day);if(scroll)window.scrollTo({top:0});};
    if(cache[date]){go(cache[date]);return;}
    load('data/days/'+date+'.json').then(function(d){cache[date]=d;go(d);}).catch(function(){
      if(cur!==date)return;
      $('view').innerHTML='<div class="card state">この日のニュースを読み込めませんでした。<br><button id="retry">もう一度読み込む</button></div>';
      $('retry').onclick=function(){show(date);};
    });
  }
  function route(scroll){
    var m=/^#d-(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
    var date=m&&index.some(function(e){return e.date===m[1];})?m[1]:(index[0]&&index[0].date);
    if(date)show(date,scroll);
  }
  function pick(date){
    if(location.hash==='#d-'+date){route(true);return;}
    location.hash='d-'+date;
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest('.day,.bitem');
    if(b){$('back').open=false;pick(b.dataset.d);return;}
    var t=e.target.closest('.tile');
    if(t){var s=document.getElementById(t.dataset.go);if(s)s.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});return;}
    var k=e.target.closest('.t,.gitem');
    if(k){e.stopPropagation();if(opener===k&&isOpen){closeSheet(0);return;}openSheet(k.dataset.k,k);}
  });
  $('prev').onclick=function(){var i=index.findIndex(function(e){return e.date===cur;});if(index[i+1])pick(index[i+1].date);};
  $('next').onclick=function(){var i=index.findIndex(function(e){return e.date===cur;});if(i>0)pick(index[i-1].date);};
  window.addEventListener('hashchange',function(){route(true);});

  // sticky chrome: show scroll-edge fade only once content is under it
  if('IntersectionObserver' in window){
    var sentinel=document.createElement('div');sentinel.style.height='1px';
    $('barwrap').parentNode.insertBefore(sentinel,$('barwrap'));
    new IntersectionObserver(function(en){$('barwrap').classList.toggle('stuck',!en[0].isIntersecting);}).observe(sentinel);
  }

  /* ---- Bottom sheet: spring physics, 1:1 drag, velocity handoff, momentum projection ---- */
  var sheet=$('sheet'), scrim=$('scrim'), tEl=$('sh-t'), cEl=$('sh-c'), xBtn=$('sh-x');
  var opener=null, isOpen=false, y=0, v=0, target=0, raf=0, H=1;
  function height(){return sheet.getBoundingClientRect().height||window.innerHeight*.8;}
  function paint(){
    sheet.style.transform='translate3d(0,'+y+'px,0)';
    scrim.style.opacity=String(Math.max(0,Math.min(1,1-y/H)));
  }
  // Apple-style spring: damping ratio + response(s)
  function spring(to,velocity,damping,response,done){
    cancelAnimationFrame(raf);
    target=to; v=velocity||0;
    if(reduceMotion){y=to;v=0;paint();if(done)done();return;}
    var k=Math.pow(2*Math.PI/response,2), c=4*Math.PI*damping/response, last=performance.now();
    (function step(now){
      var dt=Math.min(.032,(now-last)/1000); last=now;
      var n=4, h=dt/n;
      for(var i=0;i<n;i++){var a=-k*(y-target)-c*v; v+=a*h; y+=v*h;}
      paint();
      if(Math.abs(y-target)<.5&&Math.abs(v)<5){y=target;v=0;paint();if(done)done();return;}
      raf=requestAnimationFrame(step);
    })(last);
  }
  function openSheet(k,btn){
    var d=terms[k]; if(!d) return;
    if(opener) opener.setAttribute('aria-expanded','false');
    opener=btn; btn.setAttribute('aria-expanded','true');
    tEl.textContent=d.name;
    cEl.innerHTML='<div class="card blk mean"><span class="label">💡 意味</span><p>'+esc(d.mean)+'</p></div>'+
      '<div class="card blk"><span class="label">🗒 たとえるなら</span><p>'+esc(d.analogy)+'</p></div>'+
      '<div class="card blk"><span class="label">📰 このニュースでは</span><p>'+esc(d.context)+'</p></div>';
    cEl.scrollTop=0;
    var wasOpen=isOpen;
    sheet.classList.add('on'); scrim.classList.add('on'); sheet.setAttribute('aria-hidden','false');
    H=height();
    if(!wasOpen&&!raf){y=H;paint();}
    isOpen=true;
    spring(0,v,1,.35);   // critically damped, starts from the live position
    setTimeout(function(){xBtn.focus({preventScroll:true});},60);
  }
  function closeSheet(velocity){
    if(!isOpen) return;
    isOpen=false; H=height();
    scrim.classList.remove('on'); sheet.setAttribute('aria-hidden','true');
    if(opener){opener.setAttribute('aria-expanded','false'); try{opener.focus({preventScroll:true});}catch(e){} opener=null;}
    spring(H,velocity||0,1,.3,function(){if(!isOpen){sheet.classList.remove('on');raf=0;}});
  }
  scrim.addEventListener('click',function(){closeSheet(0);});
  xBtn.addEventListener('click',function(){closeSheet(0);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet(0);});

  function rubber(o,dim){return (o*dim*.55)/(dim+.55*Math.abs(o));}
  function project(vel){var d=.998;return (vel/1000)*d/(1-d);}
  var drag=null;
  sheet.addEventListener('pointerdown',function(e){
    if(!isOpen) return;
    var inContent=cEl.contains(e.target);
    if(inContent&&cEl.scrollTop>0) return;
    if(e.target.closest('button')) return;
    drag={id:e.pointerId,y0:e.clientY,start:y,hist:[{y:e.clientY,t:e.timeStamp}],active:false,inContent:inContent};
  });
  sheet.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id) return;
    var dy=e.clientY-drag.y0;
    if(!drag.active){
      if(Math.abs(dy)<8) return;
      if(drag.inContent&&dy<0){drag=null;return;}  // let content scroll up
      drag.active=true; cancelAnimationFrame(raf); raf=0; H=height();
      try{sheet.setPointerCapture(e.pointerId);}catch(_){}
    }
    var raw=drag.start+dy;
    y=raw<0?rubber(raw,H):raw; paint();
    drag.hist.push({y:e.clientY,t:e.timeStamp}); if(drag.hist.length>6)drag.hist.shift();
  });
  function endDrag(e){
    if(!drag||e.pointerId!==drag.id) return;
    var d=drag; drag=null; if(!d.active) return;
    var h=d.hist, a=h[0], b=h[h.length-1], dt=(b.t-a.t)||16, vel=(b.y-a.y)/dt*1000;
    var landing=y+project(vel);
    if(landing>H*.5) closeSheet(vel); else spring(0,vel,.8,.3);  // momentum release gets a little bounce
  }
  sheet.addEventListener('pointerup',endDrag);
  sheet.addEventListener('pointercancel',endDrag);

  load('data/index.json').then(function(j){
    index=(j.days||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
    if(!index.length){$('view').innerHTML='<div class="card state">まだニュースがありません。</div>';return;}
    renderStrip(); route(false);
  }).catch(function(){
    $('view').innerHTML='<div class="card state">ニュースの一覧を読み込めませんでした。<br><button id="reload">再読み込み</button></div>';
    $('reload').onclick=function(){location.reload();};
  });
})();
</script>
</body>
</html>
